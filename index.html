<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級外掃區與工具管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { -webkit-text-size-adjust: 100%; }
        .dragging { opacity: 0.4; }
        .drag-over { background-color: #eff6ff !important; border-color: #3b82f6 !important; border-style: dashed !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-broom text-2xl text-yellow-300"></i>
                <h1 class="text-lg md:text-xl font-bold tracking-wider">班級外掃區與工具管理系統</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openToolSummaryModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-calculator"></i> 統計所需掃具
                </button>
                <button onclick="openAddZoneModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-plus"></i> 新增外掃區
                </button>
                <button onclick="openAddToolModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-tag"></i> 新增工具標籤
                </button>
                <button onclick="openStatsModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-chart-bar"></i> 表現統計總表
                </button>
                <button onclick="exportData()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-download"></i> 匯出 (JSON)
                </button>
                <button onclick="document.getElementById('import-file-input').click()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg shadow flex items-center gap-1 transition">
                    <i class="fa-solid fa-upload"></i> 匯入 (JSON)
                </button>
                <input type="file" id="import-file-input" accept=".json" class="hidden" onchange="importData(event)">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <aside class="lg:col-span-1 bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col h-fit sticky top-20">
            <h2 class="font-bold text-slate-700 mb-2 flex items-center justify-between">
                <span><i class="fa-solid fa-users text-indigo-600"></i> 待分配學生</span>
                <span id="unassigned-count" class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded-full">0</span>
            </h2>
            <p class="text-xs text-slate-400 mb-3">請將座號拖曳至右側外掃區，或點擊學生進行工具配發。</p>
            
            <div id="unassigned-container" 
                 ondragover="allowDrop(event)" 
                 ondrop="dropToUnassigned(event)" 
                 class="flex flex-col gap-2 min-h-[300px] max-h-[60vh] overflow-y-auto p-2 bg-slate-50 rounded-lg border border-dashed border-slate-300">
            </div>
        </aside>

        <section class="lg:col-span-3 flex flex-col gap-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="font-bold text-slate-800 text-lg">外掃區任務分配與工具點選</h2>
                    <p class="text-xs text-slate-500">點擊學生姓名可開啟「工具配發與表現評估」視窗。</p>
                </div>
                <button onclick="resetAllAssignments()" class="text-xs text-rose-600 hover:text-rose-800 border border-rose-200 px-3 py-1 rounded-md hover:bg-rose-50 transition">
                    重設所有分配
                </button>
            </div>

            <div id="zones-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>
        </section>
    </main>

    <!-- 學生設定 Modal -->
    <div id="student-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-student-title" class="font-bold text-lg text-slate-800">學生管理</h3>
                <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">今日工作表現狀態：</label>
                    <select id="modal-performance-select" class="w-full border rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="認真">🟢 認真 (正常)</option>
                        <option value="遲到">🟡 遲到</option>
                        <option value="未出現">🔴 未出現</option>
                        <option value="未認真">🟠 態度未認真</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">配發掃地工具 (可複選)：</label>
                    <div id="modal-tools-container" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto p-2 bg-slate-50 border rounded-lg">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="closeStudentModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-sm rounded-lg hover:bg-slate-200 transition">取消</button>
                <button onclick="saveStudentModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700 transition">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 掃具總計統計 Modal -->
    <div id="tool-summary-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-calculator text-emerald-600"></i> 全班所需掃具總計清單</h3>
                <button onclick="closeToolSummaryModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-500">以下為目前所有外掃區學生已配發工具的總數量統計：</p>
            <div class="flex-1 overflow-y-auto border rounded-lg">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-3 border-b">工具名稱</th>
                            <th class="p-3 border-b text-center">總需求數量</th>
                        </tr>
                    </thead>
                    <tbody id="tool-summary-table-body">
                    </tbody>
                </table>
            </div>
            <div class="flex justify-end pt-2 border-t">
                <button onclick="closeToolSummaryModal()" class="px-4 py-2 bg-slate-700 text-white text-sm rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <!-- 外掃區新增與編輯 Modal -->
    <div id="zone-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 id="zone-modal-title" class="font-bold text-lg text-slate-800 border-b pb-2">新增外掃區</h3>
            <input type="hidden" id="zone-edit-id">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">外掃區名稱：</label>
                <input type="text" id="zone-name-input" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500" placeholder="例如：操場司令台旁">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">空格容量（至多幾位學生）：</label>
                <input type="number" id="zone-capacity-input" value="6" min="1" max="15" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeZoneModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-sm rounded-lg">取消</button>
                <button onclick="saveZoneModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- 新增工具標籤 Modal -->
    <div id="tool-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4">
            <h3 class="font-bold text-lg text-slate-800 border-b pb-2">新增自訂工具標籤</h3>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">工具名稱：</label>
                <input type="text" id="new-tool-input" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500" placeholder="例如：長柄刷">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeToolModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-sm rounded-lg">取消</button>
                <button onclick="saveToolModal()" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg">確認新增</button>
            </div>
        </div>
    </div>

    <!-- 表現統計總表 Modal -->
    <div id="stats-modal" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full p-6 space-y-4 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-chart-bar text-amber-600"></i> 全班掃地工作表現與遲到/未出現統計總表</h3>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto border rounded-lg">
                <table class="w-full text-left border-collapse text-sm">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-3 border-b">座號姓名</th>
                            <th class="p-3 border-b text-center">🟢 認真次數</th>
                            <th class="p-3 border-b text-center text-amber-600">🟡 遲到累積</th>
                            <th class="p-3 border-b text-center text-rose-600">🔴 未出現累積</th>
                            <th class="p-3 border-b text-center">🟠 未認真累積</th>
                        </tr>
                    </thead>
                    <tbody id="stats-table-body">
                    </tbody>
                </table>
            </div>
            <div class="flex justify-end pt-2 border-t">
                <button onclick="closeStatsModal()" class="px-4 py-2 bg-slate-700 text-white text-sm rounded-lg">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let STUDENTS = [];
        for (let i = 1; i <= 30; i++) {
            STUDENTS.push({
                id: i,
                name: `${i < 10 ? '0' + i : i}號`,
                zoneId: null,
                isLeader: false,
                tools: [],
                performance: "認真",
                stats: { 認真: 0, 遲到: 0, 未出現: 0, 未認真: 0 }
            });
        }

        let ZONES = [
            { id: "z_1", name: "汽車停放區", capacity: 6, leaderId: null, order: 1 },
            { id: "z_2", name: "華徑步道", capacity: 6, leaderId: null, order: 2 },
            { id: "z_3", name: "華徑旁綠地", capacity: 6, leaderId: null, order: 3 },
            { id: "z_4", name: "二年一班教室後方紅磚道", capacity: 6, leaderId: null, order: 4 },
            { id: "z_5", name: "資源回收室旁紅磚道及綠地", capacity: 6, leaderId: null, order: 5 },
            { id: "z_6", name: "一年四班教室後方紅磚道", capacity: 6, leaderId: null, order: 6 },
            { id: "z_7", name: "團輔室", capacity: 6, leaderId: null, order: 7 },
            { id: "z_8", name: "輔導室內部及走廊", capacity: 6, leaderId: null, order: 8 },
            { id: "z_9", name: "輔導室旁廁所走廊", capacity: 6, leaderId: null, order: 9 }
        ];

        let TOOL_TAGS = [
            "竹掃把", "塑膠掃把", "畚斗", "夾子", "橘水桶", "大垃圾桶", "拖把", "掃把", "抹布"
        ];

        let currentEditingStudentId = null;

        function loadData() {
            const savedStudents = localStorage.getItem("cleaning_students");
            const savedZones = localStorage.getItem("cleaning_zones");
            const savedTools = localStorage.getItem("cleaning_tools");

            if (savedStudents) STUDENTS = JSON.parse(savedStudents);
            if (savedZones) ZONES = JSON.parse(savedZones);
            if (savedTools) TOOL_TAGS = JSON.parse(savedTools);
        }

        function saveData() {
            localStorage.setItem("cleaning_students", JSON.stringify(STUDENTS));
            localStorage.setItem("cleaning_zones", JSON.stringify(ZONES));
            localStorage.setItem("cleaning_tools", JSON.stringify(TOOL_TAGS));
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadData();
            renderAll();
        });

        function renderAll() {
            renderUnassigned();
            renderZones();
            saveData();
        }

        function renderUnassigned() {
            const container = document.getElementById("unassigned-container");
            const unassigned = STUDENTS.filter(s => s.zoneId === null);
            document.getElementById("unassigned-count").innerText = unassigned.length;

            if (unassigned.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">所有學生皆已分配完畢！</div>`;
                return;
            }

            container.innerHTML = unassigned.map(s => `
                <div draggable="true" ondragstart="drag(event, ${s.id})" 
                     class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm flex justify-between items-center cursor-grab active:cursor-grabbing hover:border-indigo-400 transition">
                    <span class="font-bold text-sm text-slate-700">${s.name}</span>
                    <div class="flex items-center gap-1">
                        ${getPerformanceBadge(s.performance)}
                        <button onclick="openStudentModal(${s.id})" class="text-xs text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2 py-1 rounded">配置</button>
                    </div>
                </div>
            `).join("");
        }

        function renderZones() {
            const container = document.getElementById("zones-container");
            ZONES.sort((a, b) => a.order - b.order);

            container.innerHTML = ZONES.map((zone, index) => {
                const zoneStudents = STUDENTS.filter(s => s.zoneId === zone.id);
                if (zone.leaderId && !zoneStudents.some(s => s.id === zone.leaderId)) {
                    zone.leaderId = zoneStudents.length > 0 ? zoneStudents[0].id : null;
                }

                return `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between"
                         ondragover="allowDrop(event)" ondrop="dropToZone(event, '${zone.id}')">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-base">${zone.name}</h3>
                                    <span class="text-xs text-slate-400">容量：${zoneStudents.length} / ${zone.capacity} 人</span>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="moveZone('${zone.id}', 'up')" ${index === 0 ? 'disabled class="opacity-30 cursor-not-allowed"' : ''} class="text-xs text-slate-500 p-1 hover:bg-slate-100 rounded"><i class="fa-solid fa-arrow-up"></i></button>
                                    <button onclick="moveZone('${zone.id}', 'down')" ${index === ZONES.length - 1 ? 'disabled class="opacity-30 cursor-not-allowed"' : ''} class="text-xs text-slate-500 p-1 hover:bg-slate-100 rounded"><i class="fa-solid fa-arrow-down"></i></button>
                                    <button onclick="openEditZoneModal('${zone.id}')" class="text-xs text-indigo-600 p-1 hover:bg-indigo-50 rounded"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteZone('${zone.id}')" class="text-xs text-rose-600 p-1 hover:bg-rose-50 rounded"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>

                            <div class="bg-indigo-50/60 p-2.5 rounded-lg border border-indigo-100 mb-3 flex items-center justify-between text-xs">
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-indigo-900"><i class="fa-solid fa-user-shield text-indigo-600"></i> 負責人：</span>
                                    <select onchange="setZoneLeader('${zone.id}', this.value)" class="border rounded bg-white p-1 text-xs">
                                        <option value="">請指定負責人</option>
                                        ${zoneStudents.map(s => `<option value="${s.id}" ${zone.leaderId === s.id ? 'selected' : ''}>${s.name}</option>`).join("")}
                                    </select>
                                </div>
                                <button onclick="openReportModal('${zone.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded shadow text-[11px] flex items-center gap-1 transition">
                                    <span class="text-yellow-300">📢</span> 回報未到
                                </button>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 min-h-[90px] p-2 bg-slate-50 rounded-lg border border-dashed border-slate-200">
                                ${zoneStudents.length === 0 ? `<div class="col-span-2 text-center text-xs text-slate-400 py-4 pointer-events-none">拖曳學生座號至此處</div>` : ''}
                                ${zoneStudents.map(s => `
                                    <div draggable="true" ondragstart="drag(event, ${s.id})" 
                                         class="bg-white p-2 rounded border border-slate-200 shadow-xs flex flex-col justify-between gap-1 cursor-grab active:cursor-grabbing hover:border-indigo-400 transition">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-sm text-slate-800">${s.name} ${zone.leaderId === s.id ? '<span class="text-[10px] bg-indigo-600 text-white px-1 py-0.5 rounded ml-1">負責</span>' : ''}</span>
                                            <div class="flex items-center gap-1">
                                                ${getPerformanceBadge(s.performance)}
                                                <button onclick="openStudentModal(${s.id})" class="text-xs text-indigo-600 hover:bg-indigo-50 p-1 rounded" title="工具配發"><i class="fa-solid fa-toolbox"></i></button>
                                                <button onclick="removeFromZone(${s.id})" class="text-xs text-slate-400 hover:text-rose-600 p-1" title="移回待分配"><i class="fa-solid fa-xmark"></i></button>
                                            </div>
                                        </div>
                                        <div class="flex flex-wrap gap-1 mt-1">
                                            ${s.tools.length === 0 ? '<span class="text-[10px] text-slate-400 italic">未配發工具</span>' : s.tools.map(t => `<span class="bg-slate-100 text-slate-600 text-[10px] px-1.5 py-0.5 rounded">${t}</span>`).join("")}
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function getPerformanceBadge(perf) {
            if (perf === "遲到") return `<span class="bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-bold">遲到</span>`;
            if (perf === "未出現") return `<span class="bg-rose-100 text-rose-700 text-[10px] px-1.5 py-0.5 rounded font-bold">未到</span>`;
            if (perf === "未認真") return `<span class="bg-orange-100 text-orange-700 text-[10px] px-1.5 py-0.5 rounded font-bold">未認真</span>`;
            return `<span class="bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded font-bold">認真</span>`;
        }

        function drag(event, studentId) {
            event.dataTransfer.setData("text/plain", studentId);
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function dropToUnassigned(event) {
            event.preventDefault();
            const studentId = Number(event.dataTransfer.getData("text/plain"));
            const student = STUDENTS.find(s => s.id === studentId);
            if (student) {
                student.zoneId = null;
                student.isLeader = false;
                renderAll();
            }
        }

        function dropToZone(event, zoneId) {
            event.preventDefault();
            const studentId = Number(event.dataTransfer.getData("text/plain"));
            const student = STUDENTS.find(s => s.id === studentId);
            const zone = ZONES.find(z => z.id === zoneId);
            const zoneStudents = STUDENTS.filter(s => s.zoneId === zoneId);

            if (student && zone) {
                if (zoneStudents.length >= zone.capacity && student.zoneId !== zoneId) {
                    alert(`此區域（${zone.name}）已達到容量上限（${zone.capacity}人）！`);
                    return;
                }
                student.zoneId = zoneId;
                renderAll();
            }
        }

        function removeFromZone(studentId) {
            const student = STUDENTS.find(s => s.id === studentId);
            if (student) {
                student.zoneId = null;
                student.isLeader = false;
                renderAll();
            }
        }

        function setZoneLeader(zoneId, leaderId) {
            const zone = ZONES.find(z => z.id === zoneId);
            if (zone) {
                zone.leaderId = leaderId ? Number(leaderId) : null;
                renderAll();
            }
        }

        function openReportModal(zoneId) {
            const zone = ZONES.find(z => z.id === zoneId);
            const zoneStudents = STUDENTS.filter(s => s.zoneId === zoneId);
            if (zoneStudents.length === 0) {
                alert("此區域目前沒有分配學生！");
                return;
            }

            let html = `<div class="space-y-3"><p class="text-xs text-slate-500">請由負責人勾選未準時到達或未出席的學生：</p>`;
            zoneStudents.forEach(s => {
                html += `
                    <div class="flex items-center justify-between p-2 bg-slate-50 rounded border">
                        <span class="font-bold text-sm">${s.name}</span>
                        <div class="flex gap-2">
                            <label class="text-xs flex items-center gap-1 cursor-pointer text-amber-600"><input type="radio" name="report_${s.id}" value="遲到"> 遲到</label>
                            <label class="text-xs flex items-center gap-1 cursor-pointer text-rose-600"><input type="radio" name="report_${s.id}" value="未出現"> 未出現</label>
                            <label class="text-xs flex items-center gap-1 cursor-pointer text-emerald-600"><input type="radio" name="report_${s.id}" value="認真" checked> 正常</label>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            const modalContainer = document.createElement('div');
            modalContainer.id = "temp-report-modal";
            modalContainer.className = "fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center p-4";
            modalContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4">
                    <h3 class="font-bold text-lg text-slate-800 border-b pb-2">📢 區段回報：${zone.name}</h3>
                    ${html}
                    <div class="flex justify-end gap-2 pt-2">
                        <button onclick="document.getElementById('temp-report-modal').remove()" class="px-4 py-2 bg-slate-100 text-slate-700 text-sm rounded-lg">取消</button>
                        <button onclick="submitReport('${zoneId}')" class="px-4 py-2 bg-indigo-600 text-white text-sm rounded-lg">送出回報</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalContainer);
        }

        function submitReport(zoneId) {
            const zoneStudents = STUDENTS.filter(s => s.zoneId === zoneId);
            zoneStudents.forEach(s => {
                const radios = document.querySelectorAll(`input[name="report_${s.id}"]`);
                radios.forEach(r => {
                    if (r.checked) {
                        const oldPerf = s.performance;
                        const newPerf = r.value;
                        if (oldPerf !== newPerf) {
                            if (newPerf === "遲到") s.stats.遲到 = (s.stats.遲到 || 0) + 1;
                            if (newPerf === "未出現") s.stats.未出現 = (s.stats.未出現 || 0) + 1;
                            if (newPerf === "未認真") s.stats.未認真 = (s.stats.未認真 || 0) + 1;
                            if (newPerf === "認真") s.stats.認真 = (s.stats.認真 || 0) + 1;
                            s.performance = newPerf;
                        }
                    }
                });
            });
            document.getElementById('temp-report-modal').remove();
            renderAll();
            alert("已成功更新今日回報狀態！");
        }

        function openStudentModal(studentId) {
            currentEditingStudentId = studentId;
            const student = STUDENTS.find(s => s.id === studentId);
            document.getElementById("modal-student-title").innerText = `學生管理：${student.name}`;
            document.getElementById("modal-performance-select").value = student.performance;

            const toolsContainer = document.getElementById("modal-tools-container");
            toolsContainer.innerHTML = TOOL_TAGS.map(t => `
                <label class="flex items-center gap-2 text-xs text-slate-700 cursor-pointer bg-white p-1.5 rounded border">
                    <input type="checkbox" value="${t}" ${student.tools.includes(t) ? 'checked' : ''} class="rounded text-indigo-600">
                    ${t}
                </label>
            `).join("");

            document.getElementById("student-modal").classList.remove("hidden");
        }

        function closeStudentModal() {
            document.getElementById("student-modal").classList.add("hidden");
            currentEditingStudentId = null;
        }

        function saveStudentModal() {
            if (!currentEditingStudentId) return;
            const student = STUDENTS.find(s => s.id === currentEditingStudentId);
            
            const newPerf = document.getElementById("modal-performance-select").value;
            if (student.performance !== newPerf) {
                if (newPerf === "遲到") student.stats.遲到 = (student.stats.遲到 || 0) + 1;
                if (newPerf === "未出現") student.stats.未出現 = (student.stats.未出現 || 0) + 1;
                if (newPerf === "未認真") student.stats.未認真 = (student.stats.未認真 || 0) + 1;
                if (newPerf === "認真") student.stats.認真 = (student.stats.認真 || 0) + 1;
                student.performance = newPerf;
            }

            const checkboxes = document.querySelectorAll("#modal-tools-container input[type='checkbox']");
            student.tools = [];
            checkboxes.forEach(cb => {
                if (cb.checked) student.tools.push(cb.value);
            });

            closeStudentModal();
            renderAll();
        }

        // --- 📊 掃具總計統計功能 ---
        function openToolSummaryModal() {
            const tbody = document.getElementById("tool-summary-table-body");
            
            // 計算各工具的總數量
            const counts = {};
            TOOL_TAGS.forEach(t => counts[t] = 0);

            // 只計算已被分配到外掃區的學生工具
            STUDENTS.forEach(s => {
                if (s.zoneId !== null) {
                    s.tools.forEach(t => {
                        counts[t] = (counts[t] || 0) + 1;
                    });
                }
            });

            // 渲染至表格
            tbody.innerHTML = TOOL_TAGS.map(t => `
                <tr class="hover:bg-slate-50 border-b">
                    <td class="p-3 font-bold text-slate-800">${t}</td>
                    <td class="p-3 text-center text-emerald-700 font-bold text-base">${counts[t] || 0}</td>
                </tr>
            `).join("");

            document.getElementById("tool-summary-modal").classList.remove("hidden");
        }

        function closeToolSummaryModal() {
            document.getElementById("tool-summary-modal").classList.add("hidden");
        }

        function openAddZoneModal() {
            document.getElementById("zone-modal-title").innerText = "新增外掃區";
            document.getElementById("zone-edit-id").value = "";
            document.getElementById("zone-name-input").value = "";
            document.getElementById("zone-capacity-input").value = "6";
            document.getElementById("zone-modal").classList.remove("hidden");
        }

        function openEditZoneModal(zoneId) {
            const zone = ZONES.find(z => z.id === zoneId);
            document.getElementById("zone-modal-title").innerText = "編輯外掃區";
            document.getElementById("zone-edit-id").value = zone.id;
            document.getElementById("zone-name-input").value = zone.name;
            document.getElementById("zone-capacity-input").value = zone.capacity;
            document.getElementById("zone-modal").classList.remove("hidden");
        }

        function closeZoneModal() {
            document.getElementById("zone-modal").classList.add("hidden");
        }

        function saveZoneModal() {
            const editId = document.getElementById("zone-edit-id").value;
            const name = document.getElementById("zone-name-input").value.trim();
            const capacity = Number(document.getElementById("zone-capacity-input").value);

            if (!name) {
                alert("請輸入外掃區名稱！");
                return;
            }

            if (editId) {
                const zone = ZONES.find(z => z.id === editId);
                if (zone) {
                    zone.name = name;
                    zone.capacity = capacity;
                }
            } else {
                const newId = 'z_' + Date.now();
                ZONES.push({
                    id: newId,
                    name: name,
                    capacity: capacity,
                    leaderId: null,
                    order: ZONES.length + 1
                });
            }

            closeZoneModal();
            renderAll();
        }

        function deleteZone(zoneId) {
            if (confirm("確定要刪除此外掃區嗎？該區的學生將被移回待分配區。")) {
                STUDENTS.forEach(s => {
                    if (s.zoneId === zoneId) {
                        s.zoneId = null;
                        s.isLeader = false;
                    }
                });
                ZONES = ZONES.filter(z => z.id !== zoneId);
                renderAll();
            }
        }

        function moveZone(zoneId, direction) {
            ZONES.sort((a, b) => a.order - b.order);
            const index = ZONES.findIndex(z => z.id === zoneId);
            if (index === -1) return;

            if (direction === 'up' && index > 0) {
                const temp = ZONES[index].order;
                ZONES[index].order = ZONES[index - 1].order;
                ZONES[index - 1].order = temp;
            } else if (direction === 'down' && index < ZONES.length - 1) {
                const temp = ZONES[index].order;
                ZONES[index].order = ZONES[index + 1].order;
                ZONES[index + 1].order = temp;
            }
            renderAll();
        }

        function openAddToolModal() {
            document.getElementById("new-tool-input").value = "";
            document.getElementById("tool-modal").classList.remove("hidden");
        }

        function closeToolModal() {
            document.getElementById("tool-modal").classList.add("hidden");
        }

        function saveToolModal() {
            const toolName = document.getElementById("new-tool-input").value.trim();
            if (!toolName) {
                alert("請輸入工具名稱！");
                return;
            }
            if (TOOL_TAGS.includes(toolName)) {
                alert("此工具標籤已存在！");
                return;
            }
            TOOL_TAGS.push(toolName);
            closeToolModal();
            renderAll();
            alert("成功新增工具標籤！");
        }

        function openStatsModal() {
            const tbody = document.getElementById("stats-table-body");
            tbody.innerHTML = STUDENTS.map(s => `
                <tr class="hover:bg-slate-50 border-b">
                    <td class="p-3 font-bold text-slate-800">${s.name}</td>
                    <td class="p-3 text-center text-emerald-600 font-bold">${s.stats.認真 || 0}</td>
                    <td class="p-3 text-center text-amber-600 font-bold">${s.stats.遲到 || 0}</td>
                    <td class="p-3 text-center text-rose-600 font-bold">${s.stats.未出現 || 0}</td>
                    <td class="p-3 text-center text-orange-600 font-bold">${s.stats.未認真 || 0}</td>
                </tr>
            `).join("");
            document.getElementById("stats-modal").classList.add("hidden"); // 這裡預防性保持，但記得原本是要移除hidden
            document.getElementById("stats-modal").classList.remove("hidden");
        }

        function closeStatsModal() {
            document.getElementById("stats-modal").classList.add("hidden");
        }

        function resetAllAssignments() {
            if (confirm("確定要將所有學生從外掃區移回待分配區嗎？")) {
                STUDENTS.forEach(s => {
                    s.zoneId = null;
                    s.isLeader = false;
                });
                renderAll();
            }
        }

        function exportData() {
            try {
                const dataToExport = {
                    students: STUDENTS,
                    zones: ZONES,
                    toolTags: TOOL_TAGS,
                    exportDate: new Date().toISOString()
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `cleaning_system_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            } catch (error) {
                alert("匯出資料失敗：" + error);
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.students && imported.zones) {
                        if (confirm("確定要匯入此備份檔案嗎？現有的畫面設定與分配狀態將被覆蓋。")) {
                            STUDENTS = imported.students;
                            ZONES = imported.zones;
                            if (imported.toolTags) TOOL_TAGS = imported.toolTags;
                            renderAll();
                            alert("資料成功匯入與還原！");
                        }
                    } else {
                        alert("檔案格式不正確，無法辨識。");
                    }
                } catch (error) {
                    alert("解析 JSON 失敗，請確認檔案格式是否正確。");
                }
                event.target.value = "";
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
