<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>學生成績與學習歷程平台 v3.1</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            -webkit-text-size-adjust: 100%;
        }

        button,
        select,
        input {
            touch-action: manipulation;
        }

        .active-tab {
            background-color: #3B82F6 !important;
            color: white !important;
        }

        .dynamic-hidden {
            display: none !important;
        }

        .content-sec.hidden {
            display: none !important;
        }

        select,
        input {
            min-height: 44px;
        }

        button {
            min-height: 42px;
        }

        @media (max-width: 768px) {
            table {
                min-width: 700px;
            }

            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

<!-- ==================== 頂部 ==================== -->

<header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-4 py-3
                flex flex-wrap justify-between items-center gap-3">

        <div class="flex items-center space-x-3">

            <i class="fa-solid fa-graduation-cap
                      text-2xl text-yellow-300"></i>

            <h1 class="text-lg md:text-xl font-bold tracking-wide">

                學生成績與學習歷程平台

                <span class="text-xs md:text-sm
                             text-yellow-200 bg-indigo-800
                             px-2 py-0.5 rounded ml-1">
                    v3.1
                </span>

            </h1>

        </div>

        <!-- 身份切換 -->

        <div class="flex items-center
                    bg-indigo-900/60 p-1 rounded-lg
                    border border-indigo-400/30 text-sm">

            <span class="px-2 text-indigo-200 font-medium hidden sm:inline">
                當前身份：
            </span>

            <button type="button"
                    onclick="switchRole('student')"
                    id="role-btn-student"
                    class="role-btn px-3 py-1 rounded-md
                           font-medium text-white
                           bg-indigo-600 shadow">

                👨‍🎓 學生

            </button>

            <button type="button"
                    onclick="switchRole('teacher')"
                    id="role-btn-teacher"
                    class="role-btn px-3 py-1 rounded-md
                           font-medium text-indigo-200">

                👩‍🏫 老師

            </button>

            <button type="button"
                    onclick="switchRole('parent')"
                    id="role-btn-parent"
                    class="role-btn px-3 py-1 rounded-md
                           font-medium text-indigo-200">

                👪 家長

            </button>

        </div>

    </div>

</header>


<!-- ==================== 系統主體 ==================== -->

<div class="max-w-7xl mx-auto w-full px-4 py-6
            flex-1 flex flex-col md:flex-row gap-6">


    <!-- ==================== 左側選單 ==================== -->

    <aside class="w-full md:w-64 bg-white
                  rounded-xl shadow-sm border
                  border-slate-200 p-4 shrink-0 h-fit">

        <nav class="space-y-1">

            <button type="button"
                    onclick="switchTab('overview')"
                    id="tab-overview"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium active-tab">

                <i class="fa-solid fa-chart-pie w-5"></i>
                <span>數據總覽與統計</span>

            </button>


            <button type="button"
                    onclick="switchTab('daily')"
                    id="tab-daily"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium">

                <i class="fa-solid fa-pen-ruler w-5"></i>
                <span>平時成績</span>

            </button>


            <button type="button"
                    onclick="switchTab('exam')"
                    id="tab-exam"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium">

                <i class="fa-solid fa-award w-5"></i>
                <span>定期評量成績</span>

            </button>


            <button type="button"
                    onclick="switchTab('language')"
                    id="tab-language"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium">

                <i class="fa-solid fa-language w-5"></i>
                <span>語文檢定</span>

            </button>


            <button type="button"
                    onclick="switchTab('reading')"
                    id="tab-reading"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium">

                <i class="fa-solid fa-book-open w-5"></i>
                <span>閱讀成長</span>

            </button>


            <button type="button"
                    onclick="switchTab('support')"
                    id="tab-support"
                    class="tab-btn w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-slate-600 hover:bg-slate-100
                           font-medium">

                <i class="fa-solid fa-hands-holding-child w-5"></i>
                <span>學習扶助</span>

            </button>


            <!-- 老師專用 -->

            <button type="button"
                    onclick="switchTab('review')"
                    id="tab-review"
                    class="tab-btn teacher-only hidden
                           w-full flex items-center
                           space-x-3 px-3 py-3 rounded-lg
                           text-amber-700 bg-amber-50
                           hover:bg-amber-100 font-medium
                           border border-amber-200 mt-4">

                <i class="fa-solid fa-check-double w-5"></i>
                <span>老師審核與發布</span>

            </button>

        </nav>

    </aside>


    <!-- ==================== 右側內容 ==================== -->

    <main class="flex-1 space-y-6">


        <!-- ==================== 1. 數據總覽 ==================== -->

        <section id="sec-overview"
                 class="content-sec space-y-6">

            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <h3 class="font-bold text-slate-800 mb-4">
                    最新紀錄列表
                </h3>

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <thead class="bg-slate-100
                                      text-xs text-slate-500">

                            <tr>

                                <th class="p-3">學號/姓名</th>
                                <th class="p-3">類別</th>
                                <th class="p-3">細項名稱</th>
                                <th class="p-3">得分/進度</th>
                                <th class="p-3">狀態</th>
                                <th class="p-3">家長公開</th>

                            </tr>

                        </thead>

                        <tbody id="overview-table-body"
                               class="divide-y divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 2. 平時成績 ==================== -->

        <section id="sec-daily"
                 class="content-sec hidden space-y-6">


            <!-- 學生輸入 -->

            <div class="student-only bg-white p-6
                        rounded-xl shadow-sm border
                        border-slate-200">

                <h2 class="text-lg font-bold mb-4">

                    <i class="fa-solid fa-plus-circle
                              text-blue-600"></i>

                    登錄平時成績

                </h2>


                <form id="daily-form"
                      class="flex flex-col gap-4">


                    <div class="grid grid-cols-1
                                md:grid-cols-3 gap-4">


                        <!-- 類別 -->

                        <div>

                            <label class="block text-xs
                                          font-semibold
                                          text-slate-600 mb-1">

                                平時成績細項

                            </label>

                            <select id="daily-subcat"
                                    class="w-full border
                                           border-slate-300
                                           rounded-lg p-2
                                           text-sm">

                                <option value="平時評量">
                                    平時評量
                                </option>

                                <option value="雲端速測">
                                    雲端速測
                                </option>

                                <option value="小考分數">
                                    小考分數
                                </option>

                                <option value="作業分數">
                                    作業分數
                                </option>

                            </select>

                        </div>


                        <!-- 科目 -->

                        <div id="dynamic-daily-subject"
                             class="md:col-span-2">

                            <label class="block text-xs
                                          font-semibold
                                          text-slate-600 mb-1">

                                科目名稱

                            </label>

                            <select id="daily-subject-val"
                                    class="w-full border
                                           border-slate-300
                                           rounded-lg p-2
                                           text-sm">

                                <option value="國語">國語</option>
                                <option value="英語">英語</option>
                                <option value="數學">數學</option>
                                <option value="自然">自然</option>
                                <option value="社會">社會</option>

                            </select>

                        </div>


                        <!-- 作業 -->

                        <div id="dynamic-hw"
                             class="md:col-span-2
                                    dynamic-hidden">

                            <div class="grid grid-cols-1
                                        sm:grid-cols-2 gap-2">

                                <div>

                                    <label class="block text-xs
                                                  font-semibold
                                                  text-slate-600 mb-1">

                                        作業項目

                                    </label>

                                    <select id="hw-type"
                                            class="w-full border
                                                   border-slate-300
                                                   rounded-lg p-2
                                                   text-sm">

                                        <option value="國習">
                                            國習
                                        </option>

                                        <option value="數習">
                                            數習
                                        </option>

                                        <option value="作文">
                                            作文
                                        </option>

                                    </select>

                                </div>


                                <div>

                                    <label id="hw-unit-label"
                                           class="block text-xs
                                                  font-semibold
                                                  text-slate-600 mb-1">

                                        單元名稱

                                    </label>

                                    <input type="text"
                                           id="hw-unit-val"
                                           placeholder="請填寫範圍"
                                           class="w-full border
                                                  border-slate-300
                                                  rounded-lg p-2
                                                  text-sm">

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- 課別 -->

                    <div id="dynamic-cloud-quiz"
                         class="dynamic-hidden
                                bg-blue-50 p-3 rounded-lg
                                border border-blue-100">

                        <label class="block text-xs
                                      font-semibold
                                      text-slate-600 mb-2">

                            國語單元範圍（可複選）

                        </label>

                        <div id="lesson-checkboxes"
                             class="grid grid-cols-3
                                    md:grid-cols-6 gap-3
                                    text-sm">

                        </div>

                    </div>


                    <!-- 分數 -->

                    <div class="grid grid-cols-1
                                md:grid-cols-3 gap-4">


                        <!-- 數字分數 -->

                        <div id="score-number-container">

                            <label class="block text-xs
                                          font-semibold
                                          text-slate-600 mb-1">

                                分數

                            </label>

                            <input type="number"
                                   id="daily-score-val"
                                   min="0"
                                   max="100"
                                   placeholder="0-100"
                                   class="w-full border
                                          border-slate-300
                                          rounded-lg p-2
                                          text-sm">

                        </div>


                        <!-- 等第 -->

                        <div id="score-grade-container"
                             class="dynamic-hidden">

                            <label class="block text-xs
                                          font-semibold
                                          text-slate-600 mb-1">

                                等第標籤

                            </label>

                            <select id="daily-grade-val"
                                    class="w-full border
                                           border-slate-300
                                           rounded-lg p-2
                                           text-sm font-bold
                                           bg-blue-50
                                           text-blue-700">

                                <option value="甲上上">甲上上</option>
                                <option value="甲上">甲上</option>
                                <option value="甲">甲</option>
                                <option value="甲下">甲下</option>
                                <option value="甲下下">甲下下</option>

                            </select>

                        </div>


                        <div class="md:col-span-2
                                    flex items-end
                                    justify-end">

                            <button type="submit"
                                    class="w-full md:w-auto
                                           bg-blue-600
                                           text-white px-6 py-3
                                           rounded-lg text-sm
                                           font-medium">

                                送出審核

                            </button>

                        </div>

                    </div>

                </form>

            </div>


            <!-- 列表 -->

            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="daily-list"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 3. 定期評量 ==================== -->

        <section id="sec-exam"
                 class="content-sec hidden space-y-6">

            <div class="student-only bg-white p-6
                        rounded-xl shadow-sm border
                        border-slate-200">

                <form id="exam-form"
                      class="grid grid-cols-1
                             md:grid-cols-3 gap-4">

                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            評量階段

                        </label>

                        <select id="exam-subcat"
                                class="w-full border p-2
                                       rounded-lg text-sm">

                            <option value="期中評量">
                                期中評量
                            </option>

                            <option value="期末評量">
                                期末評量
                            </option>

                        </select>

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            科目

                        </label>

                        <input type="text"
                               id="exam-title"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            分數

                        </label>

                        <input type="number"
                               id="exam-score"
                               required
                               min="0"
                               max="100"
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div class="md:col-span-3 text-right">

                        <button type="submit"
                                class="bg-blue-600
                                       text-white px-5 py-3
                                       rounded-lg text-sm">

                            提交

                        </button>

                    </div>

                </form>

            </div>


            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="exam-list"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 4. 語文檢定 ==================== -->

        <section id="sec-language"
                 class="content-sec hidden space-y-6">

            <div class="student-only bg-white p-6
                        rounded-xl shadow-sm border
                        border-slate-200">

                <form id="language-form"
                      class="grid grid-cols-1
                             md:grid-cols-3 gap-4">

                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            檢定項目

                        </label>

                        <select id="lang-subcat"
                                class="w-full border p-2
                                       rounded-lg text-sm">

                            <option value="英檢單字檢定">
                                英檢單字檢定
                            </option>

                            <option value="每週一句">
                                每週一句
                            </option>

                        </select>

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            範圍

                        </label>

                        <input type="text"
                               id="lang-title"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            結果

                        </label>

                        <input type="text"
                               id="lang-score"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div class="md:col-span-3 text-right">

                        <button type="submit"
                                class="bg-blue-600
                                       text-white px-5 py-3
                                       rounded-lg text-sm">

                            提交

                        </button>

                    </div>

                </form>

            </div>


            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="lang-list"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 5. 閱讀成長 ==================== -->

        <section id="sec-reading"
                 class="content-sec hidden space-y-6">

            <div class="student-only bg-white p-6
                        rounded-xl shadow-sm border
                        border-slate-200">

                <form id="reading-form"
                      class="grid grid-cols-1
                             md:grid-cols-2 gap-4">

                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            書名

                        </label>

                        <input type="text"
                               id="reading-title"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            心得

                        </label>

                        <input type="text"
                               id="reading-score"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div class="md:col-span-2 text-right">

                        <button type="submit"
                                class="bg-blue-600
                                       text-white px-5 py-3
                                       rounded-lg text-sm">

                            提交

                        </button>

                    </div>

                </form>

            </div>


            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="reading-list"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 6. 學習扶助 ==================== -->

        <section id="sec-support"
                 class="content-sec hidden space-y-6">

            <div class="student-only bg-white p-6
                        rounded-xl shadow-sm border
                        border-slate-200">

                <form id="support-form"
                      class="grid grid-cols-1
                             md:grid-cols-3 gap-4">

                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            扶助科目

                        </label>

                        <select id="support-subcat"
                                class="w-full border p-2
                                       rounded-lg text-sm">

                            <option value="國語扶助">
                                國語扶助
                            </option>

                            <option value="數學扶助">
                                數學扶助
                            </option>

                            <option value="英語扶助">
                                英語扶助
                            </option>

                        </select>

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            項目

                        </label>

                        <input type="text"
                               id="support-title"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div>

                        <label class="block text-xs
                                      font-semibold mb-1">

                            得分

                        </label>

                        <input type="text"
                               id="support-score"
                               required
                               class="w-full border p-2
                                      rounded-lg text-sm">

                    </div>


                    <div class="md:col-span-3 text-right">

                        <button type="submit"
                                class="bg-blue-600
                                       text-white px-5 py-3
                                       rounded-lg text-sm">

                            提交

                        </button>

                    </div>

                </form>

            </div>


            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-slate-200">

                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="support-list"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 7. 老師審核 ==================== -->

        <section id="sec-review"
                 class="content-sec hidden space-y-6">

            <div class="bg-white p-6 rounded-xl
                        shadow-sm border border-amber-200">

                <h2 class="text-lg font-bold
                           text-slate-800 mb-4">

                    學生成績檢核與家長發布管理

                </h2>


                <div class="table-wrapper">

                    <table class="w-full text-sm text-left">

                        <tbody id="review-table-body"
                               class="divide-y
                                      divide-slate-100">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ==================== 測試資料重設 ==================== -->

        <div class="text-right mt-4">

            <button type="button"
                    onclick="resetTestData()"
                    class="text-xs text-red-500
                           border border-red-300
                           px-3 py-2 rounded">

                一鍵重設測試資料

            </button>

        </div>

    </main>

</div>


<!-- ==================== JavaScript ==================== -->

<script>

"use strict";

/* ==========================================
   基本資料
========================================== */

let records = [];
let currentRole = "student";

const VALID_ROLES = [
    "student",
    "teacher",
    "parent"
];


/* ==========================================
   頁面載入
========================================== */

document.addEventListener("DOMContentLoaded", function () {

    try {

        createLessonCheckboxes();

        loadData();

        const urlParams =
            new URLSearchParams(window.location.search);

        const mode = urlParams.get("mode");

        const role =
            VALID_ROLES.includes(mode)
                ? mode
                : "student";

        switchRole(role);

        updateDailyForm();

        console.log("系統初始化完成");

    } catch (error) {

        console.error("初始化錯誤：", error);

        alert(
            "網頁初始化時發生錯誤。\n\n" +
            "請重新整理網頁後再試一次。"
        );

    }

});


/* ==========================================
   建立第 1～12 課
========================================== */

function createLessonCheckboxes() {

    const container =
        document.getElementById("lesson-checkboxes");

    if (!container) return;

    let html = "";

    for (let i = 1; i <= 12; i++) {

        html += `
            <label class="flex items-center gap-2
                          cursor-pointer p-1">

                <input
                    type="checkbox"
                    name="lesson-cb"
                    value="${i}"
                    class="w-4 h-4">

                <span>第${i}課</span>

            </label>
        `;

    }

    container.innerHTML = html;

}


/* ==========================================
   讀取資料
========================================== */

function loadData() {

    try {

        const saved =
            localStorage.getItem("gradeRecords");

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                records = parsed;

            } else {

                records = [];

            }

        } else {

            records = [];

        }

    } catch (error) {

        console.error(
            "讀取 localStorage 失敗：",
            error
        );

        records = [];

    }

}


/* ==========================================
   儲存資料
========================================== */

function saveData() {

    try {

        localStorage.setItem(
            "gradeRecords",
            JSON.stringify(records)
        );

        renderAll();

    } catch (error) {

        console.error(
            "儲存資料失敗：",
            error
        );

        alert(
            "資料儲存失敗。\n\n" +
            "可能是瀏覽器儲存空間或隱私設定造成。"
        );

    }

}


/* ==========================================
   身份切換
========================================== */

function switchRole(role) {

    if (!VALID_ROLES.includes(role)) {

        role = "student";

    }

    currentRole = role;


    /* 按鈕樣式 */

    VALID_ROLES.forEach(function (r) {

        const btn =
            document.getElementById(
                "role-btn-" + r
            );

        if (!btn) return;

        if (r === role) {

            btn.className =
                "role-btn px-3 py-1 rounded-md " +
                "font-medium text-white " +
                "bg-indigo-600 shadow";

        } else {

            btn.className =
                "role-btn px-3 py-1 rounded-md " +
                "font-medium text-indigo-200";

        }

    });


    /* 學生功能 */

    document
        .querySelectorAll(".student-only")
        .forEach(function (el) {

            if (role === "student") {

                el.classList.remove("hidden");

            } else {

                el.classList.add("hidden");

            }

        });


    /* 老師功能 */

    document
        .querySelectorAll(".teacher-only")
        .forEach(function (el) {

            if (role === "teacher") {

                el.classList.remove("hidden");

            } else {

                el.classList.add("hidden");

            }

        });


    /* 如果不是老師，不允許停留審核頁 */

    if (
        role !== "teacher" &&
        document
            .getElementById("sec-review")
            .classList
            .contains("hidden") === false
    ) {

        switchTab("overview");

    }


    renderAll();

}


/* ==========================================
   分頁切換
========================================== */

function switchTab(tabKey) {

    const validTabs = [
        "overview",
        "daily",
        "exam",
        "language",
        "reading",
        "support",
        "review"
    ];

    if (!validTabs.includes(tabKey)) {

        tabKey = "overview";

    }


    /* 老師頁面權限 */

    if (
        tabKey === "review" &&
        currentRole !== "teacher"
    ) {

        alert("只有老師可以使用審核功能。");

        return;

    }


    document
        .querySelectorAll(".tab-btn")
        .forEach(function (btn) {

            btn.classList.remove("active-tab");

        });


    document
        .querySelectorAll(".content-sec")
        .forEach(function (sec) {

            sec.classList.add("hidden");

        });


    const button =
        document.getElementById(
            "tab-" + tabKey
        );

    const section =
        document.getElementById(
            "sec-" + tabKey
        );


    if (button) {

        button.classList.add("active-tab");

    }


    if (section) {

        section.classList.remove("hidden");

    }

}

/* ==========================================
   建立新紀錄
========================================== */

function addRecord(mainCat) {

    if (currentRole !== "student") {

        alert("目前身份無法新增成績。");

        return;

    }


    let subCat = "";
    let title = "";
    let score = "";


    /* ==========================
       平時成績
    ========================== */

    if (mainCat === "平時成績") {

        subCat =
            document.getElementById(
                "daily-subcat"
            ).value;


        /* 平時評量 */

        if (subCat === "平時評量") {

            const subject =
                document.getElementById(
                    "daily-subject-val"
                ).value;

            const scoreInput =
                document.getElementById(
                    "daily-score-val"
                );


            if (
                scoreInput.value === "" ||
                Number(scoreInput.value) < 0 ||
                Number(scoreInput.value) > 100
            ) {

                alert(
                    "請輸入 0～100 的分數。"
                );

                scoreInput.focus();

                return;

            }


            title = subject;

            score =
                scoreInput.value + " 分";

        }


        /* 雲端速測／小考 */

        else if (
            subCat === "雲端速測" ||
            subCat === "小考分數"
        ) {

            const checked =
                document.querySelectorAll(
                    'input[name="lesson-cb"]:checked'
                );


            if (checked.length === 0) {

                alert("請至少勾選一個課別。");

                return;

            }


            const lessons =
                Array.from(checked)
                    .map(function (cb) {
                        return cb.value;
                    })
                    .join("、");


            const scoreInput =
                document.getElementById(
                    "daily-score-val"
                );


            if (
                scoreInput.value === "" ||
                Number(scoreInput.value) < 0 ||
                Number(scoreInput.value) > 100
            ) {

                alert(
                    "請輸入 0～100 的分數。"
                );

                scoreInput.focus();

                return;

            }


            title =
                "國語 第 " +
                lessons +
                " 課";

            score =
                scoreInput.value +
                " 分";

        }


        /* 作業 */

        else if (subCat === "作業分數") {

            const hwType =
                document.getElementById(
                    "hw-type"
                ).value;

            const unit =
                document.getElementById(
                    "hw-unit-val"
                ).value.trim();


            if (unit === "") {

                alert(
                    hwType === "作文"
                        ? "請填寫第幾篇作文。"
                        : "請填寫單元名稱。"
                );

                document
                    .getElementById(
                        "hw-unit-val"
                    )
                    .focus();

                return;

            }


            if (hwType === "國習") {

                title =
                    "國習（" +
                    unit +
                    "）";

                score =
                    document.getElementById(
                        "daily-grade-val"
                    ).value;

            }


            else if (hwType === "數習") {

                const scoreInput =
                    document.getElementById(
                        "daily-score-val"
                    );


                if (
                    scoreInput.value === "" ||
                    Number(scoreInput.value) < 0 ||
                    Number(scoreInput.value) > 100
                ) {

                    alert(
                        "請輸入 0～100 的分數。"
                    );

                    scoreInput.focus();

                    return;

                }


                title =
                    "數習（" +
                    unit +
                    "）";

                score =
                    scoreInput.value +
                    " 分";

            }


            else if (hwType === "作文") {

                const scoreInput =
                    document.getElementById(
                        "daily-score-val"
                    );


                if (
                    scoreInput.value === "" ||
                    Number(scoreInput.value) < 0 ||
                    Number(scoreInput.value) > 100
                ) {

                    alert(
                        "請輸入 0～100 的分數。"
                    );

                    scoreInput.focus();

                    return;

                }


                title =
                    "作文（第" +
                    unit +
                    "篇）";

                score =
                    scoreInput.value +
                    " 分";

            }

        }

    }


    /* ==========================
       定期評量
    ========================== */

    else if (
        mainCat === "定期評量成績"
    ) {

        subCat =
            document.getElementById(
                "exam-subcat"
            ).value;

        title =
            document.getElementById(
                "exam-title"
            ).value.trim();

        const scoreInput =
            document.getElementById(
                "exam-score"
            );


        if (title === "") {

            alert("請輸入科目。");

            return;

        }


        if (
            scoreInput.value === "" ||
            Number(scoreInput.value) < 0 ||
            Number(scoreInput.value) > 100
        ) {

            alert(
                "請輸入 0～100 的分數。"
            );

            scoreInput.focus();

            return;

        }


        score =
            scoreInput.value +
            " 分";

    }


    /* ==========================
       語文檢定
    ========================== */

    else if (
        mainCat === "語文檢定"
    ) {

        subCat =
            document.getElementById(
                "lang-subcat"
            ).value;

        title =
            document.getElementById(
                "lang-title"
            ).value.trim();

        score =
            document.getElementById(
                "lang-score"
            ).value.trim();


        if (!title || !score) {

            alert("請完整填寫資料。");

            return;

        }

    }


    /* ==========================
       閱讀成長
    ========================== */

    else if (
        mainCat === "閱讀成長"
    ) {

        subCat = "閱讀心得";

        title =
            document.getElementById(
                "reading-title"
            ).value.trim();

        score =
            document.getElementById(
                "reading-score"
            ).value.trim();


        if (!title || !score) {

            alert("請完整填寫書名與心得。");

            return;

        }

    }


    /* ==========================
       學習扶助
    ========================== */

    else if (
        mainCat === "學習扶助"
    ) {

        subCat =
            document.getElementById(
                "support-subcat"
            ).value;

        title =
            document.getElementById(
                "support-title"
            ).value.trim();

        score =
            document.getElementById(
                "support-score"
            ).value.trim();


        if (!title || !score) {

            alert("請完整填寫資料。");

            return;

        }

    }


    /* ==========================
       寫入資料
    ========================== */

    const newRecord = {

        id:
            (window.crypto &&
             crypto.randomUUID)
                ? crypto.randomUUID()
                : String(Date.now()),

        student:
            "01號 王小明",

        mainCat:
            mainCat,

        subCat:
            subCat,

        title:
            title,

        score:
            score,

        status:
            "pending",

        visibleToParent:
            false,

        createdAt:
            new Date().toISOString()

    };


    records.unshift(newRecord);

    saveData();


    alert(
        "✅ 提交成功！\n\n" +
        "目前狀態：待老師審核"
    );


    resetForm(mainCat);

}


/* ==========================================
   表單重設
========================================== */

function resetForm(mainCat) {

    let formId = "";

    if (mainCat === "平時成績") {

        formId = "daily-form";

    }

    else if (
        mainCat === "定期評量成績"
    ) {

        formId = "exam-form";

    }

    else if (
        mainCat === "語文檢定"
    ) {

        formId = "language-form";

    }

    else if (
        mainCat === "閱讀成長"
    ) {

        formId = "reading-form";

    }

    else if (
        mainCat === "學習扶助"
    ) {

        formId = "support-form";

    }


    const form =
        document.getElementById(formId);


    if (form) {

        form.reset();

    }


    if (mainCat === "平時成績") {

        document
            .querySelectorAll(
                'input[name="lesson-cb"]'
            )
            .forEach(function (cb) {

                cb.checked = false;

            });

        updateDailyForm();

    }

}


/* ==========================================
   老師核可
========================================== */

function toggleApprove(id) {

    if (currentRole !== "teacher") {

        alert(
            "只有老師可以審核成績。"
        );

        return;

    }


    const item =
        records.find(function (r) {

            return String(r.id) === String(id);

        });


    if (!item) return;


    item.status =
        item.status === "approved"
            ? "pending"
            : "approved";


    saveData();

}


/* ==========================================
   家長公開
========================================== */

function toggleParentVisible(id) {

    if (currentRole !== "teacher") {

        alert(
            "只有老師可以設定家長公開狀態。"
        );

        return;

    }


    const item =
        records.find(function (r) {

            return String(r.id) === String(id);

        });


    if (!item) return;


    if (item.status !== "approved") {

        alert(
            "請先核可成績，再設定家長公開。"
        );

        return;

    }


    item.visibleToParent =
        !item.visibleToParent;


    saveData();

}


/* ==========================================
   HTML 安全處理
========================================== */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   所有畫面重新繪製
========================================== */

function renderAll() {

    const filtered =
        currentRole === "parent"

            ? records.filter(function (r) {

                return (
                    r.status === "approved" &&
                    r.visibleToParent === true
                );

            })

            : records;


    renderOverview(filtered);

    renderCategoryList(

    renderCategoryList(

        "定期評量成績",
        filtered
    );

    renderCategoryList(
        "lang-list",
        "語文檢定",
        filtered
    );

    renderCategoryList(
        "reading-list",
        "閱讀成長",
        filtered
    );

    renderCategoryList(
        "support-list",
        "學習扶助",
        filtered
    );


    renderReview();

}
