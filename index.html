
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生成績與學習歷程平台 v3.0</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { background-color: #3B82F6 !important; color: white !important; }
        .dynamic-hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
                <h1 class="text-xl font-bold tracking-wide">學生成績與學習歷程平台 <span class="text-sm text-yellow-200 bg-indigo-800 px-2 py-0.5 rounded ml-2">v3.0</span></h1>
            </div>
            
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium">當前身份：</span>
                <button type="button" onclick="switchRole('student')" id="role-btn-student" class="px-3 py-1 rounded-md transition font-medium text-white bg-indigo-600 shadow">👨‍🎓 學生</button>
                <button type="button" onclick="switchRole('teacher')" id="role-btn-teacher" class="px-3 py-1 rounded-md transition font-medium text-indigo-200 hover:text-white">👩‍🏫 老師</button>
                <button type="button" onclick="switchRole('parent')" id="role-btn-parent" class="px-3 py-1 rounded-md transition font-medium text-indigo-200 hover:text-white">👪 家長</button>
            </div>
        </div>
    </header>

    <!-- 系統主體區塊 -->
    <div class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col md:flex-row gap-6">

        <!-- 左側選單 -->
        <aside class="w-full md:w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 h-fit">
            <nav class="space-y-1">
                <button type="button" onclick="switchTab('overview')" id="tab-overview" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium active-tab">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>數據總覽與統計</span>
                </button>
                <button type="button" onclick="switchTab('daily')" id="tab-daily" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-pen-ruler w-5"></i><span>平時成績</span>
                </button>
                <button type="button" onclick="switchTab('exam')" id="tab-exam" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-award w-5"></i><span>定期評量成績</span>
                </button>
                <button type="button" onclick="switchTab('language')" id="tab-language" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-language w-5"></i><span>語文檢定</span>
                </button>
                <button type="button" onclick="switchTab('reading')" id="tab-reading" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-book-open w-5"></i><span>閱讀成長</span>
                </button>
                <button type="button" onclick="switchTab('support')" id="tab-support" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-hands-holding-child w-5"></i><span>學習扶助</span>
                </button>
                <button type="button" onclick="switchTab('review')" id="tab-review" class="tab-btn teacher-only hidden w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-amber-700 bg-amber-50 hover:bg-amber-100 font-medium border border-amber-200 mt-4">
                    <i class="fa-solid fa-check-double w-5"></i><span>老師審核與發布</span>
                </button>
            </nav>
        </aside>

        <!-- 右側主要內容 -->
        <main class="flex-1 space-y-6">

            <!-- 1. 數據總覽 -->
            <section id="sec-overview" class="content-sec space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4">最新紀錄列表</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 text-xs text-slate-500 uppercase">
                                <tr>
                                    <th class="p-3">學號/姓名</th><th class="p-3">類別</th><th class="p-3">細項名稱</th>
                                    <th class="p-3">得分/進度</th><th class="p-3">狀態</th><th class="p-3">家長公開</th>
                                </tr>
                            </thead>
                            <tbody id="overview-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- 2. 平時成績 -->
            <section id="sec-daily" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-4 text-slate-800"><i class="fa-solid fa-plus-circle text-blue-600"></i> 登錄平時成績</h2>
                    <form onsubmit="addRecord(event, '平時成績')" class="flex flex-col gap-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">平時成績細項</label>
                                <select id="daily-subcat" onchange="updateDailyForm()" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                    <option value="平時評量">平時評量</option>
                                    <option value="雲端速測">雲端速測</option>
                                    <option value="小考分數">小考分數</option>
                                    <option value="作業分數">作業分數</option>
                                </select>
                            </div>

                            <div id="dynamic-daily-subject" class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">科目名稱</label>
                                <select id="daily-subject-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                    <option value="國語">國語</option><option value="英語">英語</option><option value="數學">數學</option><option value="自然">自然</option><option value="社會">社會</option>
                                </select>
                            </div>

                            <div id="dynamic-hw" class="md:col-span-2 dynamic-hidden flex gap-2">
                                <div class="w-1/2">
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">作業項目</label>
                                    <select id="hw-type" onchange="updateDailyForm()" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                        <option value="國習">國習</option><option value="數習">數習</option><option value="作文">作文</option>
                                    </select>
                                </div>
                                <div class="w-1/2">
                                    <label id="hw-unit-label" class="block text-xs font-semibold text-slate-600 mb-1">單元名稱</label>
                                    <input type="text" id="hw-unit-val" placeholder="請填寫範圍" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                </div>
                            </div>
                        </div>

                        <div id="dynamic-cloud-quiz" class="dynamic-hidden bg-blue-50 p-3 rounded-lg border border-blue-100">
                            <label class="block text-xs font-semibold text-slate-600 mb-2">國語單元範圍 (可複選)</label>
                            <div class="grid grid-cols-3 md:grid-cols-6 gap-2 text-sm" id="lesson-checkboxes">
                                <!-- JS 動態生成選項以免程式碼過長 -->
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3">
                            <div id="score-number-container">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">分數</label>
                                <input type="number" id="daily-score-val" min="0" max="100" placeholder="0-100" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <div id="score-grade-container" class="dynamic-hidden">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">等地標籤</label>
                                <select id="daily-grade-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-blue-50 text-blue-700">
                                    <option value="甲上上">甲上上</option><option value="甲上">甲上</option><option value="甲">甲</option><option value="甲下">甲下</option><option value="甲下下">甲下下</option>
                                </select>
                            </div>
                            <div class="md:col-span-2 flex items-end justify-end pb-1 mt-3 md:mt-0">
                                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">送出審核</button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm text-left"><tbody id="daily-list" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>

            <!-- 3. 定期評量成績 -->
            <section id="sec-exam" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <form onsubmit="addRecord(event, '定期評量成績')" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-semibold mb-1">評量階段</label><select id="exam-subcat" class="w-full border p-2 rounded-lg text-sm"><option value="期中評量">期中評量</option><option value="期末評量">期末評量</option></select></div>
                        <div><label class="block text-xs font-semibold mb-1">科目</label><input type="text" id="exam-title" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-semibold mb-1">分數</label><input type="number" id="exam-score" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div class="md:col-span-3 text-right"><button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">提交</button></div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm text-left"><tbody id="exam-list" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>

            <!-- 4. 語文檢定 -->
            <section id="sec-language" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <form onsubmit="addRecord(event, '語文檢定')" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-semibold mb-1">檢定項目</label><select id="lang-subcat" class="w-full border p-2 rounded-lg text-sm"><option value="英檢單字檢定">英檢單字檢定</option><option value="每週一句">每週一句</option></select></div>
                        <div><label class="block text-xs font-semibold mb-1">範圍</label><input type="text" id="lang-title" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-semibold mb-1">結果</label><input type="text" id="lang-score" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div class="md:col-span-3 text-right"><button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">提交</button></div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm text-left"><tbody id="lang-list" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>

            <!-- 5. 閱讀成長 -->
            <section id="sec-reading" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <form onsubmit="addRecord(event, '閱讀成長')" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div><label class="block text-xs font-semibold mb-1">書名</label><input type="text" id="reading-title" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-semibold mb-1">心得</label><input type="text" id="reading-score" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div class="md:col-span-2 text-right"><button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">提交</button></div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm text-left"><tbody id="reading-list" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>

            <!-- 6. 學習扶助 -->
            <section id="sec-support" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <form onsubmit="addRecord(event, '學習扶助')" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-semibold mb-1">扶助科目</label><select id="support-subcat" class="w-full border p-2 rounded-lg text-sm"><option value="國語扶助">國語扶助</option></select></div>
                        <div><label class="block text-xs font-semibold mb-1">項目</label><input type="text" id="support-title" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="block text-xs font-semibold mb-1">得分</label><input type="text" id="support-score" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div class="md:col-span-3 text-right"><button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm">提交</button></div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <table class="w-full text-sm text-left"><tbody id="support-list" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>

            <!-- 7. 老師審核 -->
            <section id="sec-review" class="content-sec hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-amber-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">學生成績檢核與家長發布管理</h2>
                    <table class="w-full text-sm text-left"><tbody id="review-table-body" class="divide-y divide-slate-100"></tbody></table>
                </div>
            </section>
            
            <div class="text-right mt-4">
                <button type="button" onclick="localStorage.removeItem('gradeRecords'); location.reload();" class="text-xs text-red-500 border border-red-300 px-3 py-1 rounded">一鍵重設測試資料 (網頁卡住請點此)</button>
            </div>

        </main>
    </div>

    <script>
        // JS 邏輯區
        let records = [];
        let currentRole = 'student'; 

        document.addEventListener("DOMContentLoaded", function() {
            // 生成 1~12 課的 Checkbox
            let cbHTML = "";
            for(let i=1; i<=12; i++) {
                cbHTML += `<label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="lesson-cb" value="${i}"> 第${i}課</label>`;
            }
            document.getElementById('lesson-checkboxes').innerHTML = cbHTML;

            // 讀取資料
            try {
                let saved = localStorage.getItem('gradeRecords');
                if (saved) { records = JSON.parse(saved); }
                if (!Array.isArray(records)) { records = []; }
            } catch (e) { records = []; }

            const urlParams = new URLSearchParams(window.location.search);
            switchRole(urlParams.get('mode') || 'student');
            updateDailyForm();
        });

        function saveData() { 
            localStorage.setItem('gradeRecords', JSON.stringify(records)); 
            renderAll(); 
        }

        function switchRole(role) {
            currentRole = role;
            ['student', 'teacher', 'parent'].forEach(r => {
                let btn = document.getElementById(`role-btn-${r}`);
                if(btn) {
                    btn.className = (r === role) 
                        ? "px-3 py-1 rounded-md font-medium text-white bg-indigo-600 shadow"
                        : "px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white";
                }
            });

            document.querySelectorAll('.student-only').forEach(el => el.classList.toggle('hidden', role !== 'student'));
            document.querySelectorAll('.teacher-only').forEach(el => el.classList.toggle('hidden', role !== 'teacher'));
            renderAll();
        }

        function switchTab(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.querySelectorAll('.content-sec').forEach(sec => sec.classList.add('hidden'));
            
            let tBtn = document.getElementById(`tab-${tabKey}`);
            let tSec = document.getElementById(`sec-${tabKey}`);
            if(tBtn) tBtn.classList.add('active-tab');
            if(tSec) tSec.classList.remove('hidden');
        }

        function updateDailyForm() {
            let subcat = document.getElementById('daily-subcat').value;
            let hwType = document.getElementById('hw-type').value;

            ['dynamic-daily-subject', 'dynamic-cloud-quiz', 'dynamic-hw', 'score-number-container', 'score-grade-container'].forEach(id => {
                document.getElementById(id).classList.add('dynamic-hidden');
            });

            if (subcat === '平時評量') {
                document.getElementById('dynamic-daily-subject').classList.remove('dynamic-hidden');
                document.getElementById('score-number-container').classList.remove('dynamic-hidden');
            } else if (subcat === '雲端速測' || subcat === '小考分數') {
                document.getElementById('dynamic-cloud-quiz').classList.remove('dynamic-hidden');
                document.getElementById('score-number-container').classList.remove('dynamic-hidden');
            } else if (subcat === '作業分數') {
                document.getElementById('dynamic-hw').classList.remove('dynamic-hidden');
                if (hwType === '國習') {
                    document.getElementById('hw-unit-label').innerText = "單元名稱";
                    document.getElementById('score-grade-container').classList.remove('dynamic-hidden');
                } else if (hwType === '數習') {
                    document.getElementById('hw-unit-label').innerText = "單元名稱";
                    document.getElementById('score-number-container').classList.remove('dynamic-hidden');
                } else if (hwType === '作文') {
                    document.getElementById('hw-unit-label').innerText = "第幾篇？";
                    document.getElementById('score-number-container').classList.remove('dynamic-hidden');
                }
            }
        }

        function addRecord(e, mainCat) {
            e.preventDefault();
            let subCat = "", title = "", score = "";

            if (mainCat === '平時成績') {
                subCat = document.getElementById('daily-subcat').value;
                if (subCat === '平時評量') {
                    title = document.getElementById('daily-subject-val').value;
                    score = document.getElementById('daily-score-val').value + " 分";
                } else if (subCat === '雲端速測' || subCat === '小考分數') {
                    let checkedBoxes = document.querySelectorAll('input[name="lesson-cb"]:checked');
                    if(checkedBoxes.length === 0) { alert("請勾選課別！"); return; }
                    let lessons = Array.from(checkedBoxes).map(cb => cb.value).join('、');
                    title = "國語 第 " + lessons + " 課";
                    score = document.getElementById('daily-score-val').value + " 分";
                } else if (subCat === '作業分數') {
                    let hwType = document.getElementById('hw-type').value;
                    let hwUnit = document.getElementById('hw-unit-val').value || "未填";
                    if (hwType === '國習') { title = `國習 (${hwUnit})`; score = document.getElementById('daily-grade-val').value; } 
                    else if (hwType === '數習') { title = `數習 (${hwUnit})`; score = document.getElementById('daily-score-val').value + " 分"; } 
                    else if (hwType === '作文') { title = `作文 (第${hwUnit}篇)`; score = document.getElementById('daily-score-val').value + " 分"; }
                }
            } else {
                if(mainCat === '定期評量成績') { subCat = document.getElementById('exam-subcat').value; title = document.getElementById('exam-title').value; score = document.getElementById('exam-score').value + " 分"; }
                if(mainCat === '語文檢定') { subCat = document.getElementById('lang-subcat').value; title = document.getElementById('lang-title').value; score = document.getElementById('lang-score').value; }
                if(mainCat === '閱讀成長') { subCat = "閱讀心得"; title = document.getElementById('reading-title').value; score = document.getElementById('reading-score').value; }
                if(mainCat === '學習扶助') { subCat = document.getElementById('support-subcat').value; title = document.getElementById('support-title').value; score = document.getElementById('support-score').value; }
            }

            records.unshift({ id: Date.now(), student: "01號 王小明", mainCat, subCat, title, score, status: "pending", visibleToParent: false });
            saveData();
            alert("✅ 提交成功！");
            e.target.reset();
            if(mainCat === '平時成績') updateDailyForm(); 
        }

        function toggleApprove(id) { let item = records.find(r => r.id === id); if (item) { item.status = (item.status === 'approved') ? 'pending' : 'approved'; saveData(); } }
        function toggleParentVisible(id) { let item = records.find(r => r.id === id); if (item) { item.visibleToParent = !item.visibleToParent; saveData(); } }
        
        function renderAll() {
            let filtered = (currentRole === 'parent') ? records.filter(r => r.status === 'approved' && r.visibleToParent) : records;

            document.getElementById('overview-table-body').innerHTML = filtered.map(r => `<tr class="border-b"><td class="p-3">${r.student}</td><td class="p-3"><span class="bg-slate-200 text-xs px-2 py-1 rounded">${r.mainCat}</span></td><td class="p-3">${r.subCat} - ${r.title}</td><td class="p-3 text-indigo-600 font-bold">${r.score}</td><td class="p-3">${r.status === 'approved' ? '✓' : '⏳'}</td><td class="p-3">${r.visibleToParent ? '👁️' : '🔒'}</td></tr>`).join('');
            
            ['daily-list', 'exam-list', 'lang-list', 'reading-list', 'support-list'].forEach(id => {
                let catMap = { 'daily-list': '平時成績', 'exam-list': '定期評量成績', 'lang-list': '語文檢定', 'reading-list': '閱讀成長', 'support-list': '學習扶助' };
                let items = filtered.filter(r => r.mainCat === catMap[id]);
                document.getElementById(id).innerHTML = items.length ? items.map(r => `<tr class="border-b"><td class="p-3">${r.student}</td><td class="p-3">${r.subCat}</td><td class="p-3">${r.title}</td><td class="p-3 text-indigo-600 font-bold">${r.score}</td><td class="p-3">${r.status === 'approved' ? '已核可' : '待審核'}</td></tr>`).join('') : `<tr><td colspan="5" class="p-4 text-center text-slate-400">尚無紀錄</td></tr>`;
            });

            document.getElementById('review-table-body').innerHTML = records.map(r => `<tr class="border-b"><td class="p-3">${r.student}</td><td class="p-3 text-xs">${r.mainCat}</td><td class="p-3">${r.subCat} (${r.title})</td><td class="p-3 text-indigo-600 font-bold">${r.score}</td><td class="p-3"><button type="button" onclick="toggleApprove(${r.id})" class="px-3 py-1 rounded text-xs text-white ${r.status === 'approved' ? 'bg-emerald-500' : 'bg-slate-400'}">${r.status === 'approved' ? '已核可' : '點擊核可'}</button></td><td class="p-3"><label class="cursor-pointer text-xs"><input type="checkbox" onchange="toggleParentVisible(${r.id})" ${r.visibleToParent ? 'checked' : ''}> 公開</label></td></tr>`).join('');
        }
    </script>
</body>
</html>
