
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生成績與學習歷程管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .active-tab { background-color: #3B82F6 !important; color: white !important; }
        /* 自訂隱藏樣式 */
        .dynamic-hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
                <h1 class="text-xl font-bold tracking-wide">學生成績與學習歷程平台</h1>
            </div>
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium">當前身份：</span>
                <button type="button" onclick="switchRole('student')" id="role-btn-student" class="px-3 py-1 rounded-md transition font-medium text-white bg-indigo-600 shadow">👨‍🎓 學生</button>
                <button type="button" onclick="switchRole('teacher')" id="role-btn-teacher" class="px-3 py-1 rounded-md transition font-medium text-indigo-200 hover:text-white">👩‍🏫 老師</button>
                <button type="button" onclick="switchRole('parent')" id="role-btn-parent" class="px-3 py-1 rounded-md transition font-medium text-indigo-200 hover:text-white">👪 家長</button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col md:flex-row gap-6">

        <aside class="w-full md:w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 h-fit">
            <div id="role-banner" class="mb-4 p-3 rounded-lg text-xs font-semibold flex items-center gap-2 bg-blue-50 text-blue-700">
                <i class="fa-solid fa-circle-info"></i>
                <span id="role-desc">學生模式：填寫與查看個人成績狀態</span>
            </div>
            <nav class="space-y-1">
                <button type="button" onclick="switchTab('overview')" id="tab-overview" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium active-tab">
                    <i class="fa-solid fa-chart-pie w-5"></i><span>數據總覽與統計</span>
                </button>
                <button type="button" onclick="switchTab('daily')" id="tab-daily" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-pen-ruler w-5"></i><span>平時成績</span>
                </button>
                <button type="button" onclick="switchTab('exam')" id="tab-exam" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-award w-5"></i><span>定期評量成績</span>
                </button>
                <button type="button" onclick="switchTab('language')" id="tab-language" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-language w-5"></i><span>語文檢定</span>
                </button>
                <button type="button" onclick="switchTab('reading')" id="tab-reading" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-book-open w-5"></i><span>閱讀成長</span>
                </button>
                <button type="button" onclick="switchTab('support')" id="tab-support" class="tab-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                    <i class="fa-solid fa-hands-holding-child w-5"></i><span>學習扶助</span>
                </button>
                <button type="button" onclick="switchTab('review')" id="tab-review" class="tab-btn teacher-only hidden w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-amber-700 bg-amber-50 hover:bg-amber-100 font-medium border border-amber-200 mt-4">
                    <i class="fa-solid fa-check-double w-5"></i><span>老師審核與發布</span>
                </button>
            </nav>
        </aside>

        <main class="flex-1 space-y-6">

            <section id="sec-overview" class="content-sec space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4">最新紀錄列表</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 text-xs text-slate-500 uppercase">
                                <tr>
                                    <th class="p-3">學號/姓名</th><th class="p-3">類別</th><th class="p-3">細項名稱</th>
                                    <th class="p-3">得分/進度</th><th class="p-3">審核狀態</th><th class="p-3">家長公開</th>
                                </tr>
                            </thead>
                            <tbody id="overview-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="sec-daily" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
                        <i class="fa-solid fa-plus-circle text-blue-600"></i> 登錄平時成績
                    </h2>
                    <form onsubmit="addRecord(event, '平時成績')" class="flex flex-col gap-4">
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">平時成績細項</label>
                                <select id="daily-subcat" onchange="updateDailyForm()" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500">
                                    <option value="平時評量">平時評量</option>
                                    <option value="雲端速測">雲端速測</option>
                                    <option value="小考分數">小考分數</option>
                                    <option value="作業分數">作業分數</option>
                                </select>
                            </div>

                            <div id="dynamic-daily-subject" class="md:col-span-2">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">科目名稱</label>
                                <select id="daily-subject-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                    <option value="國語">國語</option>
                                    <option value="英語">英語</option>
                                    <option value="數學">數學</option>
                                    <option value="自然">自然</option>
                                    <option value="社會">社會</option>
                                </select>
                            </div>

                            <div id="dynamic-hw" class="md:col-span-2 dynamic-hidden flex gap-2">
                                <div class="w-1/2">
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">作業項目</label>
                                    <select id="hw-type" onchange="updateDailyForm()" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                        <option value="國習">國習</option>
                                        <option value="數習">數習</option>
                                        <option value="作文">作文</option>
                                    </select>
                                </div>
                                <div class="w-1/2">
                                    <label id="hw-unit-label" class="block text-xs font-semibold text-slate-600 mb-1">單元名稱</label>
                                    <input type="text" id="hw-unit-val" placeholder="請輸入單元或篇數" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                </div>
                            </div>
                        </div>

                        <div id="dynamic-cloud-quiz" class="dynamic-hidden bg-blue-50 p-3 rounded-lg border border-blue-100">
                            <label class="block text-xs font-semibold text-slate-600 mb-2">國語單元範圍 (可複選)</label>
                            <div class="grid grid-cols-3 md:grid-cols-6 gap-2 text-sm">
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="1"> 第1課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="2"> 第2課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="3"> 第3課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="4"> 第4課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="5"> 第5課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="6"> 第6課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="7"> 第7課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="8"> 第8課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="9"> 第9課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="10"> 第10課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="11"> 第11課</label>
                                <label class="flex items-center gap-1 cursor-pointer hover:text-blue-600"><input type="checkbox" name="lesson-cb" value="12"> 第12課</label>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3">
                            <div id="score-number-container">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">分數</label>
                                <input type="number" id="daily-score-val" min="0" max="100" placeholder="0-100" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                            </div>
                            <div id="score-grade-container" class="dynamic-hidden">
                                <label class="block text-xs font-semibold text-slate-600 mb-1">等地標籤</label>
                                <select id="daily-grade-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm text-blue-700 font-bold bg-blue-50">
                                    <option value="甲上上">甲上上</option>
                                    <option value="甲上">甲上</option>
                                    <option value="甲">甲</option>
                                    <option value="甲下">甲下</option>
                                    <option value="甲下下">甲下下</option>
                                </select>
                            </div>
                            <div class="md:col-span-2 flex items-end justify-end pb-1 mt-3 md:mt-0">
                                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition shadow-sm">送出成績審核</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-4">平時成績明細與清單</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-100 text-xs text-slate-500 uppercase"><tr><th class="p-3">學生</th><th class="p-3">細項</th><th class="p-3">名稱</th><th class="p-3">分數</th><th class="p-3">狀態</th></tr></thead>
                            <tbody id="daily-list" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="sec-exam" class="content-sec hidden space-y-6">
                <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
