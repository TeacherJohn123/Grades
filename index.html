<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生成績登錄與學習歷程系統 v7.2 (完整整合版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #3b82f6; }
    </style>
</head>
<body class="p-6">

<div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-8">
    
    <header class="mb-8 border-b pb-4 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-black text-slate-800">學生成績與學習歷程系統</h1>
            <p class="text-slate-500 mt-1">Version 7.2 (包含語文檢定、平時成績分期、定期評量統計)</p>
        </div>
        <div class="space-x-2">
            <button onclick="switchRole('student')" class="bg-blue-100 text-blue-700 px-4 py-2 rounded font-bold hover:bg-blue-200">學生/家長視角</button>
            <button onclick="switchRole('teacher')" class="bg-emerald-100 text-emerald-700 px-4 py-2 rounded font-bold hover:bg-emerald-200">老師視角</button>
        </div>
    </header>

    <div id="view-student" class="space-y-10">
        
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-4"><i class="fa-solid fa-pen-to-square"></i> 登錄平時成績</h3>
                <form id="daily-form" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">結算期程</label>
                            <select id="daily-period" class="w-full border rounded p-2 text-sm">
                                <option value="期中">期中</option>
                                <option value="期末">期末</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">成績項目</label>
                            <select id="daily-subcat" class="w-full border rounded p-2 text-sm">
                                <option value="平時評量">平時評量</option>
                                <option value="雲端速測">雲端速測</option>
                                <option value="小考分數">小考分數</option>
                                <option value="作業分數">作業分數</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">科目</label>
                            <select id="daily-subject" class="w-full border rounded p-2 text-sm">
                                <option value="國語">國語</option>
                                <option value="英語">英語</option>
                                <option value="數學">數學</option>
                                <option value="自然">自然</option>
                                <option value="社會">社會</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">分數/等第</label>
                            <input type="text" id="daily-score" placeholder="輸入分數或甲上上" class="w-full border rounded p-2 text-sm">
                        </div>
                    </div>
                    <div id="lesson-checkboxes" class="text-sm space-x-2 text-slate-600 py-2">
                        <label><input type="checkbox" value="L1"> L1</label>
                        <label><input type="checkbox" value="L2"> L2</label>
                        <label><input type="checkbox" value="L3"> L3</label>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">提交成績</button>
                </form>
            </div>

            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                <h3 class="font-bold text-slate-700 mb-4"><i class="fa-solid fa-file-signature"></i> 登錄定期評量 (按Enter儲存不跳轉)</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-600">國語</span>
                        <input type="number" class="exam-score-input border rounded p-2 w-24 text-center" data-subject="國語" placeholder="分數">
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-slate-600">數學</span>
                        <input type="number" class="exam-score-input border rounded p-2 w-24 text-center" data-subject="數學" placeholder="分數">
                    </div>
                    <p class="text-xs text-slate-400 mt-2">* 游標停留在輸入框按 Enter 即可觸發儲存，不跳轉。</p>
                </div>
            </div>
        </section>

        <section>
            <div class="flex border-b border-slate-200 mb-4">
                <button id="tab-midterm" class="px-6 py-2 font-bold tab-active transition-colors" onclick="switchPeriodTab('期中')">期中平時成績</button>
                <button id="tab-final" class="px-6 py-2 font-bold tab-inactive transition-colors" onclick="switchPeriodTab('期末')">期末平時成績</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-square-poll-vertical text-blue-600"></i> 平時評量五科成績與總分
                    </h3>
                    <div id="block-regular" class="flex gap-4"></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-cloud text-sky-500"></i> 雲端速測紀錄</h3>
                    <div id="block-cloud"></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-file-pen text-amber-500"></i> 小考分數紀錄</h3>
                    <div id="block-quiz"></div>
                </div>
                <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2"><i class="fa-solid fa-book text-emerald-500"></i> 作業分數與等第紀錄</h3>
                    <div id="block-homework"></div>
                </div>
            </div>
        </section>

        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-ranking-star text-purple-600"></i> 定期評量總成績與排名</h3>
            <div id="exam-stats-container"></div>
        </section>

        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-language text-rose-500"></i> 語文檢定個人矩陣</h3>
            <div id="lang-student-matrix" class="overflow-x-auto"></div>
        </section>
    </div>

    <div id="view-teacher" class="hidden space-y-10">
        
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-calculator text-emerald-600"></i> 全班平時成績結算</h3>
                <div class="space-x-2">
                    <button onclick="calculateTeacherSummary('期中')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-bold">結算期中</button>
                    <button onclick="calculateTeacherSummary('期末')" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm font-bold">結算期末</button>
                </div>
            </div>
            <div id="teacher-summary-table" class="overflow-x-auto text-sm"></div>
        </section>

        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 mb-4"><i class="fa-solid fa-users-rectangle text-purple-600"></i> 全班語文檢定總表 (英檢與每週一句)</h3>
            <div id="teacher-lang-matrix" class="overflow-x-auto text-sm"></div>
        </section>

    </div>

</div>

<script>
    // ==========================================
    // 1. 核心資料結構與全域變數 (模擬資料庫)
    // ==========================================
    let currentViewPeriod = '期中'; // 預設頁籤狀態
    const currentStudent = '王小明';
    const studentsList = ['王小明', '陳小華', '林小美'];

    // 等第轉換對照表
    const GRADE_CONVERT = { '甲上上': 95, '甲上': 90, '甲': 85, '甲下': 80, '甲下下': 75 };

    // 模擬平時成績資料庫 (加上 period 屬性)
    let dailyRecords = [
        { student: '王小明', period: '期中', subcat: '平時評量', subject: '國語', score: 88 },
        { student: '王小明', period: '期中', subcat: '平時評量', subject: '數學', score: 92 },
        { student: '王小明', period: '期中', subcat: '雲端速測', subject: '英語', score: 85, title: 'L1-L2' },
        { student: '王小明', period: '期末', subcat: '作業分數', subject: '國語', grade: '甲上上', score: null },
    ];

    // 模擬定期評量資料庫
    let examRecords = [
        { student: '王小明', subject: '國語', score: 90 }, { student: '王小明', subject: '數學', score: 95 },
        { student: '陳小華', subject: '國語', score: 85 }, { student: '陳小華', subject: '數學', score: 88 },
        { student: '林小美', subject: '國語', score: 92 }, { student: '林小美', subject: '數學', score: 92 }
    ];

    // ==========================================
    // 2. 視角切換邏輯
    // ==========================================
    function switchRole(role) {
        document.getElementById('view-student').classList.toggle('hidden', role !== 'student');
        document.getElementById('view-teacher').classList.toggle('hidden', role !== 'teacher');
        if (role === 'student') {
            renderDailySection(currentViewPeriod);
            renderStudentExamStats();
            renderStudentLangMatrix();
        } else {
            calculateTeacherSummary('期中');
            renderTeacherLangMatrix();
        }
    }

    // ==========================================
    // 3. 學生登錄：表單記憶與不跳轉邏輯
    // ==========================================
    
    // 平時成績登錄 (保留選項，清空分數)
    document.getElementById('daily-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const period = document.getElementById('daily-period').value;
        const subcat = document.getElementById('daily-subcat').value;
        const subject = document.getElementById('daily-subject').value;
        const scoreVal = document.getElementById('daily-score').value;

        // 寫入資料庫
        const isGrade = ['甲上上', '甲上', '甲', '甲下', '甲下下'].includes(scoreVal);
        dailyRecords.push({
            student: currentStudent, period: period, subcat: subcat, subject: subject, 
            score: isGrade ? null : Number(scoreVal), grade: isGrade ? scoreVal : null, title: '新增紀錄'
        });

        alert(`【${period}】${subcat}成績已成功提交！\n(已自動保留您選擇的科目與類別)`);

        // 記憶功能：不清空下拉選單，僅清空輸入框與 Checkbox
        document.getElementById('daily-score').value = '';
        document.querySelectorAll('#lesson-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);

        // 重新渲染畫面 (自動切換至剛提交的期程頁籤)
        switchPeriodTab(period);
    });

    // 定期評量登錄 (Enter 不跳轉欄位)
    document.querySelectorAll('.exam-score-input').forEach(input => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault(); // 阻止預設行為 (跳轉或提交)
                const subject = this.dataset.subject;
                const score = this.value;
                alert(`儲存成功: ${subject} = ${score}分\n(游標並未跳轉，方便老師連續編輯/檢查)`);
                // 焦點依然留在原來的 input 上
            }
        });
    });

    // ==========================================
    // 4. 學生端：平時成績 Tabs 與四大區塊渲染
    // ==========================================
    function switchPeriodTab(period) {
        currentViewPeriod = period;
        // 更新 Tab 樣式
        document.getElementById('tab-midterm').className = period === '期中' ? 'px-6 py-2 font-bold tab-active transition-colors' : 'px-6 py-2 font-bold tab-inactive transition-colors';
        document.getElementById('tab-final').className = period === '期末' ? 'px-6 py-2 font-bold tab-active transition-colors' : 'px-6 py-2 font-bold tab-inactive transition-colors';
        renderDailySection(period);
    }

    function renderDailySection(period) {
        const myRecords = dailyRecords.filter(r => r.student === currentStudent && r.period === period);

        // 區塊 1: 平時評量五科
        const subjects = ['國語', '英語', '數學', '自然', '社會'];
        let regularHtml = '', total = 0;
        subjects.forEach(sub => {
            const rec = myRecords.find(r => r.subcat === '平時評量' && r.subject === sub);
            const score = rec ? rec.score : 0;
            total += score;
            regularHtml += `
                <div class="flex-1 bg-slate-100 p-3 rounded-lg text-center">
                    <span class="block text-xs font-bold text-slate-500">${sub}</span>
                    <span class="text-lg font-black text-slate-800">${rec ? score + ' 分' : '--'}</span>
                </div>`;
        });
        regularHtml += `
            <div class="flex-1 bg-blue-100 border border-blue-200 p-3 rounded-lg text-center">
                <span class="block text-xs font-bold text-blue-600">五科總分</span>
                <span class="text-xl font-black text-blue-800">${total} 分</span>
            </div>`;
        document.getElementById('block-regular').innerHTML = regularHtml;

        // 區塊 2-4: 列表渲染
        renderList('block-cloud', myRecords.filter(r => r.subcat === '雲端速測'));
        renderList('block-quiz', myRecords.filter(r => r
