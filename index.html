<div class="p-6 max-w-5xl mx-auto space-y-6">

  <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
      <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 平時成績登錄 (v7.1)
    </h2>
    
    <form id="daily-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">結算期程</label>
        <select id="daily-period" class="w-full p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
          <option value="midterm">期中平時</option>
          <option value="final">期末平時</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">成績細項</label>
        <select id="daily-subcat" class="w-full p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
          <option value="平時評量">平時評量</option>
          <option value="雲端速測">雲端速測</option>
          <option value="小考分數">小考分數</option>
          <option value="作業分數">作業分數</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">科目名稱</label>
        <select id="daily-subject-val" class="w-full p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
          <option value="國語">國語</option>
          <option value="英語">英語</option>
          <option value="數學">數學</option>
          <option value="自然">自然</option>
          <option value="社會">社會</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">數值分數 (0~100)</label>
        <input type="number" id="daily-score-val" min="0" max="100" placeholder="請輸入分數"
               class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">作業等第</label>
        <select id="daily-grade-val" class="w-full p-2 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
          <option value="">-- 無 --</option>
          <option value="甲上上">甲上上 (95)</option>
          <option value="甲上">甲上 (90)</option>
          <option value="甲">甲 (85)</option>
          <option value="甲下">甲下 (80)</option>
          <option value="甲下下">甲下下 (75)</option>
        </select>
      </div>

      <div class="md:col-span-3 bg-slate-50 p-3 rounded-lg border">
        <label class="block text-xs font-bold text-slate-600 mb-2">雲端速測涵蓋課別</label>
        <div id="lesson-checkboxes" class="flex flex-wrap gap-4 text-sm">
          <label class="flex items-center gap-1"><input type="checkbox" value="L1"> L1</label>
          <label class="flex items-center gap-1"><input type="checkbox" value="L2"> L2</label>
          <label class="flex items-center gap-1"><input type="checkbox" value="L3"> L3</label>
          <label class="flex items-center gap-1"><input type="checkbox" value="L4"> L4</label>
          <label class="flex items-center gap-1"><input type="checkbox" value="L5"> L5</label>
        </div>
      </div>

      <div class="md:col-span-3 text-right">
        <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-sm transition">
          提交平時成績
        </button>
      </div>
    </form>
  </div>

  <div class="bg-slate-100 p-6 rounded-xl border border-slate-200">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-bold text-slate-800">平時成績明細與總覽</h3>
      
      <div class="flex bg-slate-200 p-1 rounded-lg">
        <button id="tab-midterm" onclick="switchStudentPeriod('midterm')" 
                class="px-4 py-1.5 rounded-md font-bold text-sm bg-white text-indigo-600 shadow-sm transition">
          期中平時
        </button>
        <button id="tab-final" onclick="switchStudentPeriod('final')" 
                class="px-4 py-1.5 rounded-md font-bold text-sm text-slate-600 hover:text-slate-900 transition">
          期末平時
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-square-poll-vertical text-blue-600"></i> 平時評量五科成績與總分
        </h4>
        <div id="block-regular"></div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-cloud text-sky-500"></i> 雲端速測紀錄
        </h4>
        <div id="block-cloud"></div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-file-pen text-amber-500"></i> 小考分數紀錄
        </h4>
        <div id="block-quiz"></div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h4 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-book text-emerald-500"></i> 作業分數與等第紀錄
        </h4>
        <div id="block-homework"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ==================== 全域變數與轉換對照表 ====================
let currentStudentPeriod = 'midterm'; // 學生端預設檢視期程
let dbDailyRecords = []; // 模擬資料庫儲存紀錄

const GRADE_CONVERT = {
  '甲上上': 95,
  '甲上': 90,
  '甲': 85,
  '甲下': 80,
  '甲下下': 75
};

// ==================== 1. 表單提交與下拉選單記憶保留 ====================
document.getElementById('daily-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const record = {
    period: document.getElementById('daily-period').value, // 'midterm' 或 'final'
    subcat: document.getElementById('daily-subcat').value,
    subject: document.getElementById('daily-subject-val').value,
    score: document.getElementById('daily-score-val').value ? Number(document.getElementById('daily-score-val').value) : null,
    grade: document.getElementById('daily-grade-val').value || null,
    lessons: Array.from(document.querySelectorAll('#lesson-checkboxes input:checked')).map(cb => cb.value),
    studentName: '當前學生',
    createdAt: new Date().toISOString()
  };

  dbDailyRecords.push(record);
  alert('【v7.1】平時成績已成功提交！');

  // --- 選單記憶功能 (保留 period, subcat, subject, grade，僅清空 score 與 checkboxes) ---
  document.getElementById('daily-score-val').value = '';
  document.querySelectorAll('#lesson-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);

  // 刷新前端畫面
  renderDailySection();
});

// ==================== 2. 學生端 Tab 切換與四區塊渲染 ====================
function switchStudentPeriod(period) {
  currentStudentPeriod = period;
  
  // 更新 Tab 樣式
  const btnMidterm = document.getElementById('tab-midterm');
  const btnFinal = document.getElementById('tab-final');

  if (period === 'midterm') {
    btnMidterm.className = 'px-4 py-1.5 rounded-md font-bold text-sm bg-white text-indigo-600 shadow-sm transition';
    btnFinal.className = 'px-4 py-1.5 rounded-md font-bold text-sm text-slate-600 hover:text-slate-900 transition';
  } else {
    btnFinal.className = 'px-4 py-1.5 rounded-md font-bold text-sm bg-white text-indigo-600 shadow-sm transition';
    btnMidterm.className = 'px-4 py-1.5 rounded-md font-bold text-sm text-slate-600 hover:text-slate-900 transition';
  }

  renderDailySection();
}

function renderDailySection() {
  // 依據當前選取的期程過濾紀錄
  const filteredRecords = dbDailyRecords.filter(r => r.period === currentStudentPeriod);

  // 區塊 1: 平時評量 (五科 + 總分)
  const subjects = ['國語', '英語', '數學', '自然', '社會'];
  let regularTotal = 0;
  let regularHtml = `<div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-2">`;

  subjects.forEach(sub => {
    const rec = filteredRecords.find(r => r.subcat === '平時評量' && r.subject === sub);
    const score = rec && rec.score !== null ? rec.score : 0;
    if (rec && rec.score !== null) regularTotal += score;

    regularHtml += `
      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-center">
        <span class="block text-xs font-semibold text-slate-500">${sub}</span>
        <span class="text-lg font-bold text-slate-800">${rec && rec.score !== null ? score + ' 分' : '--'}</span>
      </div>`;
  });

  regularHtml += `
    <div class="bg-blue-50 p-3 rounded-lg border border-blue-200 text-center">
      <span class="block text-xs font-semibold text-blue-600">五科總分</span>
      <span class="text-xl font-black text-blue-700">${regularTotal} 分</span>
    </div>
  </div>`;
  document.getElementById('block-regular').innerHTML = regularHtml;

  // 區塊 2: 雲端速測
  renderListBlock('block-cloud', filteredRecords.filter(r => r.subcat === '雲端速測'));

  // 區塊 3: 小考分數
  renderListBlock('block-quiz', filteredRecords.filter(r => r.subcat === '小考分數'));

  // 區塊 4: 作業分數
  renderListBlock('block-homework', filteredRecords.filter(r => r.subcat === '作業分數'));
}

// 輔助函式：渲染列表型區塊
function renderListBlock(elementId, records) {
  if (records.length === 0) {
    document.getElementById(elementId).innerHTML = `<p class="text-sm text-slate-400 p-2">尚無當期登記紀錄</p>`;
    return;
  }
  let html = `<ul class="divide-y divide-slate-100 text-sm">`;
  records.forEach(r => {
    const displayVal = r.score !== null ? `${r.score} 分` : (r.grade || '--');
    const lessonInfo = r.lessons && r.lessons.length > 0 ? ` (${r.lessons.join(',')})` : '';
    html += `
      <li class="py-2 flex justify-between items-center">
        <span><strong class="text-slate-700">[${r.subject}]</strong>${lessonInfo}</span>
        <span class="font-semibold text-indigo-600">${displayVal}</span>
      </li>`;
  });
  html += `</ul>`;
  document.getElementById(elementId).innerHTML = html;
}

// ==================== 3. 老師端依期程結算與定期評量排名 ====================

/**
 * 老師端平時成績結算 (可傳入 'midterm' 或 'final')
 */
function calculateDailySummaryByPeriod(targetPeriod = 'midterm') {
  // 假設學生名單
  const allStudents = [{ name: '張小明' }, { name: '林小華' }];
  let summaryResults = [];

  allStudents.forEach(student => {
    // 1. 過濾該生 + 該期程紀錄
    const records = dbDailyRecords.filter(r => r.studentName === student.name && r.period === targetPeriod);

    // 2. 雲端速測平均
    const cloudRecords = records.filter(r => r.subcat === '雲端速測' && r.score !== null);
    const cloudAvg = cloudRecords.length > 0 
      ? (cloudRecords.reduce((sum, r) => sum + r.score, 0) / cloudRecords.length).toFixed(1) 
      : '無紀錄';

    // 3. 小考平均
    const quizRecords = records.filter(r => r.subcat === '小考分數' && r.score !== null);
    const quizAvg = quizRecords.length > 0 
      ? (quizRecords.reduce((sum, r) => sum + r.score, 0) / quizRecords.length).toFixed(1) 
      : '無紀錄';

    // 4. 作業分數平均 (含等第數值轉換)
    const hwRecords = records.filter(r => r.subcat === '作業分數');
    let hwAvg = '無紀錄';
    if (hwRecords.length > 0) {
      const totalHwScore = hwRecords.reduce((sum, r) => {
        const scoreVal = r.score !== null ? r.score : (GRADE_CONVERT[r.grade] || 0);
        return sum + scoreVal;
      }, 0);
      hwAvg = (totalHwScore / hwRecords.length).toFixed(1);
    }

    summaryResults.push({
      studentName: student.name,
      periodName: targetPeriod === 'midterm' ? '期中' : '期末',
      cloudAvg,
      quizAvg,
      hwAvg
    });
  });

  return summaryResults;
}

/**
 * 定期評量全班總分與排名計算
 */
function calculateExamRankings(examRecordsList) {
  // 依總分降冪排序
  let sortedData = [...examRecordsList].sort((a, b) => b.totalScore - a.totalScore);

  // 計算排名 (處理同分同名次)
  sortedData.forEach((item, index) => {
    if (index > 0 && item.totalScore === sortedData[index - 1].totalScore) {
      item.rank = sortedData[index - 1].rank;
    } else {
      item.rank = index + 1;
    }
  });

  return sortedData;
}
</script>
