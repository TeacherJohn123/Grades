
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>學生成績與學習歷程平台 v3.4</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            -webkit-text-size-adjust: 100%;
        }

        button, select, input {
            touch-action: manipulation;
        }

        .active-tab {
            background-color: #3B82F6 !important;
            color: white !important;
        }

        .dynamic-hidden {
            display: none !important;
        }

        .content-sec.hidden {
            display: none !important;
        }

        select, input {
            min-height: 44px;
        }

        button {
            min-height: 42px;
        }

        @media (max-width: 768px) {
            table {
                min-width: 750px;
            }

            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>

<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

<!-- ==================== 頂部頁首 ==================== -->
<header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
            <h1 class="text-lg md:text-xl font-bold tracking-wide">
                學生成績與學習歷程平台
                <span class="text-xs md:text-sm text-yellow-200 bg-indigo-800 px-2 py-0.5 rounded ml-1">
                    v3.4
                </span>
            </h1>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <!-- 學生名單選擇 -->
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium hidden sm:inline">👤 選擇學生：</span>
                <select id="current-student-select" onchange="switchStudent(this.value)" class="bg-indigo-800 text-white text-xs md:text-sm rounded border-none p-1 focus:ring-2 focus:ring-yellow-300">
                    <option value="01號 王小明">01號 王小明</option>
                    <option value="02號 李小美">02號 李小美</option>
                    <option value="03號 張大同">03號 張大同</option>
                    <option value="04號 林小華">04號 林小華</option>
                    <option value="05號 陳志明">05號 陳志明</option>
                </select>
            </div>

            <!-- 身份切換區 -->
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium hidden sm:inline">當前身份：</span>
                <button type="button" onclick="switchRole('student')" id="role-btn-student"
                        class="role-btn px-3 py-1 rounded-md font-medium text-white bg-indigo-600 shadow">
                    👨‍🎓 學生
                </button>
                <button type="button" onclick="switchRole('teacher')" id="role-btn-teacher"
                        class="role-btn px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white">
                    👩‍🏫 老師
                </button>
                <button type="button" onclick="switchRole('parent')" id="role-btn-parent"
                        class="role-btn px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white">
                    👪 家長
                </button>
            </div>
        </div>
    </div>
</header>


<!-- ==================== 系統主體 ==================== -->
<div class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col md:flex-row gap-6">

    <!-- ==================== 左側選單 ==================== -->
    <aside class="w-full md:w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 h-fit">
        <nav class="space-y-1">
            <button type="button" onclick="switchTab('overview')" id="tab-overview"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium active-tab">
                <i class="fa-solid fa-chart-pie w-5"></i>
                <span>數據總覽與統計</span>
            </button>

            <button type="button" onclick="switchTab('daily')" id="tab-daily"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                <i class="fa-solid fa-pen-ruler w-5"></i>
                <span>平時成績</span>
            </button>

            <button type="button" onclick="switchTab('exam')" id="tab-exam"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                <i class="fa-solid fa-award w-5"></i>
                <span>定期評量成績</span>
            </button>

            <button type="button" onclick="switchTab('language')" id="tab-language"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                <i class="fa-solid fa-language w-5"></i>
                <span>語文檢定</span>
            </button>

            <button type="button" onclick="switchTab('reading')" id="tab-reading"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                <i class="fa-solid fa-book-open w-5"></i>
                <span>閱讀成長</span>
            </button>

            <button type="button" onclick="switchTab('support')" id="tab-support"
                    class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium">
                <i class="fa-solid fa-hands-holding-child w-5"></i>
                <span>學習扶助</span>
            </button>

            <!-- 老師專用選單 -->
            <button type="button" onclick="switchTab('review')" id="tab-review"
                    class="tab-btn teacher-only hidden w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-amber-700 bg-amber-50 hover:bg-amber-100 font-medium border border-amber-200 mt-4">
                <i class="fa-solid fa-check-double w-5"></i>
                <span>老師審核與發布</span>
            </button>
        </nav>
    </aside>


    <!-- ==================== 右側內容區域 ==================== -->
    <main class="flex-1 space-y-6">

        <!-- ==================== 1. 數據總覽 ==================== -->
        <section id="sec-overview" class="content-sec space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4">最新紀錄列表</h3>
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-100 text-xs text-slate-500">
                            <tr>
                                <th class="p-3">學號/姓名</th>
                                <th class="p-3">類別</th>
                                <th class="p-3">細項名稱</th>
                                <th class="p-3">得分/進度</th>
                                <th class="p-3">審核狀態</th>
                                <th class="p-3">家長公開</th>
                                <th class="p-3">操作</th>
                            </tr>
                        </thead>
                        <tbody id="overview-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- ==================== 2. 平時成績 ==================== -->
        <section id="sec-daily" class="content-sec hidden space-y-6">

            <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-slate-800">
                    <i class="fa-solid fa-plus-circle text-blue-600 mr-1"></i> 登錄平時成績
                </h2>

                <form id="daily-form" class="flex flex-col gap-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">平時成績細項</label>
                            <select id="daily-subcat" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                <option value="平時評量">平時評量</option>
                                <option value="雲端速測">雲端速測</option>
                                <option value="小考分數">小考分數</option>
                                <option value="作業分數">作業分數</option>
                            </select>
                        </div>

                        <div id="dynamic-daily-subject" class="md:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">科目名稱</label>
                            <select id="daily-subject-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                <option value="國語">國語</option>
                                <option value="英語">英語</option>
                                <option value="數學">數學</option>
                                <option value="自然">自然</option>
                                <option value="社會">社會</option>
                            </select>
                        </div>

                        <div id="dynamic-hw" class="md:col-span-2 dynamic-hidden">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">作業項目</label>
                                    <select id="hw-type" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                                        <option value="國習">國習</option>
                                        <option value="數習">數習</option>
                                        <option value="作文">作文</option>
                                    </select>
                                </div>

                                <div>
                                    <label id="hw-unit-label" class="block text-xs font-semibold text-slate-600 mb-1">課別/單元標籤</label>
                                    <select id="hw-unit-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-blue-50/50 font-medium"></select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="dynamic-cloud-quiz" class="dynamic-hidden bg-blue-50 p-3 rounded-lg border border-blue-100">
                        <label class="block text-xs font-semibold text-slate-600 mb-2">國語單元範圍（可複選）</label>
                        <div id="lesson-checkboxes" class="grid grid-cols-3 md:grid-cols-6 gap-3 text-sm"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div id="score-number-container">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">分數</label>
                            <input type="number" id="daily-score-val" min="0" max="100" placeholder="0-100" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                        </div>

                        <div id="score-grade-container" class="dynamic-hidden">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">等第標籤</label>
                            <select id="daily-grade-val" class="w-full border border-slate-300 rounded-lg p-2 text-sm font-bold bg-blue-50 text-blue-700">
                                <option value="甲上上">甲上上</option>
                                <option value="甲上">甲上</option>
                                <option value="甲">甲</option>
                                <option value="甲下">甲下</option>
                                <option value="甲下下">甲下下</option>
                            </select>
                        </div>

                        <div class="md:col-span-2 flex items-end justify-end">
                            <button type="submit" class="w-full md:w-auto bg-blue-600 text-white px-6 py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">送出審核</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="daily-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- ==================== 3. 定期評量 ==================== -->
        <section id="sec-exam" class="content-sec hidden space-y-6">
            <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <form id="exam-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">評量階段</label>
                        <select id="exam-subcat" class="w-full border p-2 rounded-lg text-sm">
                            <option value="期中評量">期中評量</option>
                            <option value="期末評量">期末評量</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">科目名稱</label>
                        <select id="exam-title" class="w-full border p-2 rounded-lg text-sm">
                            <option value="國語">國語</option>
                            <option value="數學">數學</option>
                            <option value="英語">英語</option>
                            <option value="自然">自然</option>
                            <option value="社會">社會</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">分數</label>
                        <input type="number" id="exam-score" required min="0" max="100" placeholder="0-100" class="w-full border p-2 rounded-lg text-sm">
                    </div>
                    <div class="md:col-span-3 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">提交</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="exam-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- ==================== 4. 語文檢定 (重點升級) ==================== -->
        <section id="sec-language" class="content-sec hidden space-y-6">
            
            <!-- 學生輸入表單 -->
            <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-slate-800">
                    <i class="fa-solid fa-plus-circle text-blue-600 mr-1"></i> 登錄語文檢定紀錄
                </h2>
                <form id="language-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">檢定類別</label>
                        <select id="lang-subcat" onchange="updateLangForm()" class="w-full border p-2 rounded-lg text-sm">
                            <option value="英檢單字檢定">英檢單字檢定</option>
                            <option value="每週一句">每週一句</option>
                        </select>
                    </div>

                    <!-- 動態關卡/範圍選擇 -->
                    <div id="lang-range-container">
                        <label class="block text-xs font-semibold mb-1 text-slate-600">檢定範圍</label>
                        <select id="lang-title-select" class="w-full border p-2 rounded-lg text-sm bg-blue-50/40"></select>
                    </div>

                    <!-- 結果 (紅綠燈) -->
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">檢定結果</label>
                        <select id="lang-score-select" class="w-full border p-2 rounded-lg text-sm font-bold">
                            <option value="通過">🟢 通過</option>
                            <option value="未通過">🔴 未通過</option>
                        </select>
                    </div>

                    <!-- 每週一句專用：期末闖關分數 -->
                    <div id="lang-final-score-container" class="dynamic-hidden">
                        <label class="block text-xs font-semibold mb-1 text-amber-700">期末闖關分數</label>
                        <select id="lang-final-score-select" class="w-full border border-amber-300 p-2 rounded-lg text-sm font-bold bg-amber-50">
                            <option value="未闖關">未闖關</option>
                            <option value="未通過">未通過</option>
                            <option value="優">優</option>
                            <option value="特優">特優</option>
                        </select>
                    </div>

                    <div class="md:col-span-3 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">提交審核</button>
                    </div>
                </form>
            </div>

            <!-- 一般列表 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-3">語文檢定詳細流水帳</h3>
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="lang-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 英檢單字闖關統計矩陣 (依據身份切換個人版與全班版) -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-indigo-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-table-cells text-indigo-600"></i>
                        <span id="lang-matrix-title">英檢單字檢定通過情形矩陣圖</span>
                    </h3>
                    <span class="text-xs text-slate-500">🟢 通過 | 🔴 未通過 | ⚪ 未測驗</span>
                </div>
                <div class="table-wrapper" id="lang-matrix-wrapper"></div>
            </div>

            <!-- 每週一句闖關與期末總覽 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-emerald-100">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-comments text-emerald-600"></i>
                        <span>每週一句（1~16句）闖關進度與期末分數</span>
                    </h3>
                </div>
                <div class="table-wrapper" id="weekly-matrix-wrapper"></div>
            </div>

        </section>


        <!-- ==================== 5. 閱讀成長 ==================== -->
        <section id="sec-reading" class="content-sec hidden space-y-6">
            <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <form id="reading-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">書名</label>
                        <input type="text" id="reading-title" placeholder="請輸入書名" required class="w-full border p-2 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">心得/閱讀進度</label>
                        <input type="text" id="reading-score" placeholder="簡短閱讀心得" required class="w-full border p-2 rounded-lg text-sm">
                    </div>
                    <div class="md:col-span-2 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">提交</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="reading-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- ==================== 6. 學習扶助 ==================== -->
        <section id="sec-support" class="content-sec hidden space-y-6">
            <div class="student-only bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <form id="support-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">扶助科目</label>
                        <select id="support-subcat" class="w-full border p-2 rounded-lg text-sm">
                            <option value="國語扶助">國語扶助</option>
                            <option value="數學扶助">數學扶助</option>
                            <option value="英語扶助">英語扶助</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">項目/單元</label>
                        <input type="text" id="support-title" placeholder="請填寫評量單元" required class="w-full border p-2 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-600">得分/成果</label>
                        <input type="text" id="support-score" placeholder="填寫得分或複習狀況" required class="w-full border p-2 rounded-lg text-sm">
                    </div>
                    <div class="md:col-span-3 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-5 py-3 rounded-lg text-sm font-medium hover:bg-blue-700 transition">提交</button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="support-list" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- ==================== 7. 老師審核 ==================== -->
        <section id="sec-review" class="content-sec hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-amber-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4">學生成績檢核與家長發布管理</h2>
                <div class="table-wrapper">
                    <table class="w-full text-sm text-left">
                        <tbody id="review-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 重設資料按鈕 -->
        <div class="text-right mt-4">
            <button type="button" onclick="resetTestData()" class="text-xs text-red-500 border border-red-300 hover:bg-red-50 px-3 py-2 rounded transition">
                一鍵重設測試資料
            </button>
        </div>
    </main>
</div>


<!-- ==================== 編輯 Modal 彈窗 ==================== -->
<div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-xl border border-slate-200 space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-bold text-slate-800">✏️ 編輯待審核紀錄</h3>
            <button type="button" onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <input type="hidden" id="edit-record-id">

        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">細項與單元名稱</label>
            <input type="text" id="edit-record-title" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">得分/成果</label>
            <input type="text" id="edit-record-score" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-slate-600 bg-slate-100 rounded-lg text-sm hover:bg-slate-200 transition">取消</button>
            <button type="button" onclick="saveEditedRecord()" class="px-4 py-2 text-white bg-blue-600 rounded-lg text-sm font-medium hover:bg-blue-700 transition">儲存修改</button>
        </div>
    </div>
</div>


<!-- ==================== JavaScript 核心邏輯 ==================== -->
<script>
"use strict";

/* ==========================================
   1. 基本資料與全域變數
========================================== */
let records = [];
let currentRole = "student";
let currentStudent = "01號 王小明";
const VALID_ROLES = ["student", "teacher", "parent"];
const STUDENT_LIST = [
    "01號 王小明",
    "02號 李小美",
    "03號 張大同",
    "04號 林小華",
    "05號 陳志明"
];

/* 關卡設定 */
const ENGLISH_LEVELS = [
    { level: "第一級", pass: [2, 3, 4, 5, 6] },
    { level: "第二級", pass: [1, 2, 3, 4, 5, 6] },
    { level: "第三級", pass: [1, 2, 3, 4, 5, 6] },
    { level: "第四級", pass: [1, 2, 3, 4, 5, 6] }
];

/* ==========================================
   2. 頁面初始化
========================================== */
document.addEventListener("DOMContentLoaded", function () {
    try {
        createLessonCheckboxes();
        loadData();

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get("mode");
        const role = VALID_ROLES.includes(mode) ? mode : "student";

        switchRole(role);
        updateDailyForm();
        updateLangForm();

        console.log("系統初始化完成 v3.4");
    } catch (error) {
        console.error("初始化錯誤：", error);
        alert("網頁初始化時發生錯誤，請重新整理頁面。");
    }
});


/* ==========================================
   3. 學生切換與 Checkbox 動態建立
========================================== */
function switchStudent(studentName) {
    currentStudent = studentName;
    renderAll();
}

function createLessonCheckboxes() {
    const container = document.getElementById("lesson-checkboxes");
    if (!container) return;

    let html = "";
    for (let i = 1; i <= 12; i++) {
        html += `
            <label class="flex items-center gap-2 cursor-pointer p-1">
                <input type="checkbox" name="lesson-cb" value="${i}" class="w-4 h-4 text-blue-600 rounded">
                <span>第${i}課</span>
            </label>
        `;
    }
    container.innerHTML = html;
}


/* ==========================================
   4. LocalStorage 資料持久化
========================================== */
function loadData() {
    try {
        const saved = localStorage.getItem("gradeRecords_v34");
        if (saved) {
            const parsed = JSON.parse(saved);
            records = Array.isArray(parsed) ? parsed : [];
        } else {
            // 預設示範測試資料
            records = [
                { id: "1", student: "01號 王小明", mainCat: "語文檢定", subCat: "英檢單字檢定", title: "第一級 第2關", score: "🟢 通過", status: "approved", visibleToParent: true, createdAt: new Date().toISOString() },
                { id: "2", student: "01號 王小明", mainCat: "語文檢定", subCat: "英檢單字檢定", title: "第一級 第3關", score: "🟢 通過", status: "approved", visibleToParent: true, createdAt: new Date().toISOString() },
                { id: "3", student: "01號 王小明", mainCat: "語文檢定", subCat: "英檢單字檢定", title: "第一級 第4關", score: "🔴 未通過", status: "approved", visibleToParent: true, createdAt: new Date().toISOString() },
                { id: "4", student: "01號 王小明", mainCat: "語文檢定", subCat: "每週一句", title: "第一句", score: "🟢 通過", finalScore: "優", status: "approved", visibleToParent: true, createdAt: new Date().toISOString() },
                { id: "5", student: "02號 李小美", mainCat: "語文檢定", subCat: "英檢單字檢定", title: "第一級 第2關", score: "🟢 通過", status: "approved", visibleToParent: true, createdAt: new Date().toISOString() }
            ];
            saveData();
        }
    } catch (error) {
        console.error("讀取 localStorage 失敗：", error);
        records = [];
    }
}

function saveData() {
    try {
        localStorage.setItem("gradeRecords_v34", JSON.stringify(records));
        renderAll();
    } catch (error) {
        console.error("儲存資料失敗：", error);
        alert("資料儲存失敗。");
    }
}


/* ==========================================
   5. 身份與選單切換
========================================== */
function switchRole(role) {
    if (!VALID_ROLES.includes(role)) role = "student";
    currentRole = role;

    VALID_ROLES.forEach(function (r) {
        const btn = document.getElementById("role-btn-" + r);
        if (!btn) return;
        btn.className = (r === role)
            ? "role-btn px-3 py-1 rounded-md font-medium text-white bg-indigo-600 shadow"
            : "role-btn px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white";
    });

    document.querySelectorAll(".student-only").forEach(el => role === "student" ? el.classList.remove("hidden") : el.classList.add("hidden"));
    document.querySelectorAll(".teacher-only").forEach(el => role === "teacher" ? el.classList.remove("hidden") : el.classList.add("hidden"));

    if (role !== "teacher" && !document.getElementById("sec-review").classList.contains("hidden")) {
        switchTab("overview");
    }

    renderAll();
}

function switchTab(tabKey) {
    const validTabs = ["overview", "daily", "exam", "language", "reading", "support", "review"];
    if (!validTabs.includes(tabKey)) tabKey = "overview";

    if (tabKey === "review" && currentRole !== "teacher") {
        alert("只有老師可以使用審核功能。");
        return;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active-tab"));
    document.querySelectorAll(".content-sec").forEach(sec => sec.classList.add("hidden"));

    const button = document.getElementById("tab-" + tabKey);
    const section = document.getElementById("sec-" + tabKey);

    if (button) button.classList.add("active-tab");
    if (section) section.classList.remove("hidden");
}


/* ==========================================
   6. 平時成績與語文檢定動態表單
========================================== */
function updateDailyForm() {
    const subcatEl = document.getElementById("daily-subcat");
    const hwTypeEl = document.getElementById("hw-type");
    if (!subcatEl || !hwTypeEl) return;

    const subcat = subcatEl.value;
    const hwType = hwTypeEl.value;

    ["dynamic-daily-subject", "dynamic-cloud-quiz", "dynamic-hw", "score-number-container", "score-grade-container"]
        .forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add("dynamic-hidden");
        });

    if (subcat === "平時評量") {
        show("dynamic-daily-subject");
        show("score-number-container");
    } else if (subcat === "雲端速測" || subcat === "小考分數") {
        show("dynamic-cloud-quiz");
        show("score-number-container");
    } else if (subcat === "作業分數") {
        show("dynamic-hw");
        updateHwUnitOptions(hwType);
    }
}

function updateHwUnitOptions(hwType) {
    const unitSelect = document.getElementById("hw-unit-val");
    const label = document.getElementById("hw-unit-label");
    if (!unitSelect) return;

    let options = [];

    if (hwType === "國習") {
        if (label) label.textContent = "國習課別標籤";
        for (let i = 1; i <= 12; i++) options.push(`第${numberToChinese(i)}課`);
        show("score-grade-container");
    } else if (hwType === "數習") {
        if (label) label.textContent = "數習單元標籤";
        for (let i = 1; i <= 10; i++) options.push(`第${numberToChinese(i)}單元`);
        options.push("綜合練習（一）");
        options.push("綜合練習（二）");
        show("score-number-container");
    } else if (hwType === "作文") {
        if (label) label.textContent = "作文篇數標籤";
        for (let i = 1; i <= 10; i++) options.push(`第${numberToChinese(i)}篇`);
        show("score-number-container");
    }

    unitSelect.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
}

function updateLangForm() {
    const subcat = document.getElementById("lang-subcat").value;
    const titleSelect = document.getElementById("lang-title-select");
    const finalScoreContainer = document.getElementById("lang-final-score-container");
    if (!titleSelect) return;

    let options = [];

    if (subcat === "英檢單字檢定") {
        if (finalScoreContainer) finalScoreContainer.classList.add("dynamic-hidden");

        ENGLISH_LEVELS.forEach(lvl => {
            lvl.pass.forEach(p => {
                options.push(`${lvl.level} 第${p}關`);
            });
        });
    } else if (subcat === "每週一句") {
        if (finalScoreContainer) finalScoreContainer.classList.remove("dynamic-hidden");

        for (let i = 1; i <= 16; i++) {
            options.push(`第${numberToChinese(i)}句`);
        }
    }

    titleSelect.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join("");
}

function numberToChinese(num) {
    const chineseNums = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二", "十三", "十四", "十五", "十六"];
    return chineseNums[num] || String(num);
}

function show(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove("dynamic-hidden");
}


/* ==========================================
   7. 新增紀錄邏輯
========================================== */
function addRecord(mainCat) {
    if (currentRole !== "student") {
        alert("目前身份無法新增成績。");
        return;
    }

    let subCat = "";
    let title = "";
    let score = "";
    let finalScore = "";

    if (mainCat === "平時成績") {
        subCat = document.getElementById("daily-subcat").value;

        if (subCat === "平時評量") {
            const subject = document.getElementById("daily-subject-val").value;
            const scoreInput = document.getElementById("daily-score-val");
            if (scoreInput.value === "" || Number(scoreInput.value) < 0 || Number(scoreInput.value) > 100) {
                alert("請輸入 0～100 的分數。"); scoreInput.focus(); return;
            }
            title = subject;
            score = scoreInput.value + " 分";
        } else if (subCat === "雲端速測" || subCat === "小考分數") {
            const checked = document.querySelectorAll('input[name="lesson-cb"]:checked');
            if (checked.length === 0) { alert("請至少勾選一個課別。"); return; }
            const lessons = Array.from(checked).map(cb => cb.value).join("、");
            const scoreInput = document.getElementById("daily-score-val");
            if (scoreInput.value === "" || Number(scoreInput.value) < 0 || Number(scoreInput.value) > 100) {
                alert("請輸入 0～100 的分數。"); scoreInput.focus(); return;
            }
            title = "國語 第 " + lessons + " 課";
            score = scoreInput.value + " 分";
        } else if (subCat === "作業分數") {
            const hwType = document.getElementById("hw-type").value;
            const unit = document.getElementById("hw-unit-val").value;

            if (hwType === "國習") {
                title = `國習（${unit}）`;
                score = document.getElementById("daily-grade-val").value;
            } else if (hwType === "數習" || hwType === "作文") {
                const scoreInput = document.getElementById("daily-score-val");
                if (scoreInput.value === "" || Number(scoreInput.value) < 0 || Number(scoreInput.value) > 100) {
                    alert("請輸入 0～100 的分數。"); scoreInput.focus(); return;
                }
                title = `${hwType}（${unit}）`;
                score = scoreInput.value + " 分";
            }
        }
    } else if (mainCat === "定期評量成績") {
        subCat = document.getElementById("exam-subcat").value;
        title = document.getElementById("exam-title").value;
        const scoreInput = document.getElementById("exam-score");
        if (scoreInput.value === "" || Number(scoreInput.value) < 0 || Number(scoreInput.value) > 100) {
            alert("請輸入 0～100 的分數。"); scoreInput.focus(); return;
        }
        score = scoreInput.value + " 分";
    } else if (mainCat === "語文檢定") {
        subCat = document.getElementById("lang-subcat").value;
        title = document.getElementById("lang-title-select").value;
        score = document.getElementById("lang-score-select").value;
        if (subCat === "每週一句") {
            finalScore = document.getElementById("lang-final-score-select").value;
        }
    } else if (mainCat === "閱讀成長") {
        subCat = "閱讀心得";
        title = document.getElementById("reading-title").value.trim();
        score = document.getElementById("reading-score").value.trim();
        if (!title || !score) { alert("請完整填寫書名與心得。"); return; }
    } else if (mainCat === "學習扶助") {
        subCat = document.getElementById("support-subcat").value;
        title = document.getElementById("support-title").value.trim();
        score = document.getElementById("support-score").value.trim();
        if (!title || !score) { alert("請完整填寫資料。"); return; }
    }

    const newRecord = {
        id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
        student: currentStudent,
        mainCat: mainCat,
        subCat: subCat,
        title: title,
        score: score,
        finalScore: finalScore,
        status: "pending",
        visibleToParent: false,
        createdAt: new Date().toISOString()
    };

    records.unshift(newRecord);
    saveData();

    alert("✅ 提交成功！\n\n當前學生：" + currentStudent + "\n目前狀態：⏳ 待老師審核\n（審核前您可以隨時進行修改或刪除）");
    resetForm(mainCat);
}

function resetForm(mainCat) {
    const map = {
        "平時成績": "daily-form",
        "定期評量成績": "exam-form",
        "語文檢定": "language-form",
        "閱讀成長": "reading-form",
        "學習扶助": "support-form"
    };
    const form = document.getElementById(map[mainCat]);
    if (form) form.reset();
    if (mainCat === "平時成績") {
        document.querySelectorAll('input[name="lesson-cb"]').forEach(cb => cb.checked = false);
        updateDailyForm();
    }
    if (mainCat === "語文檢定") {
        updateLangForm();
    }
}


/* ==========================================
   8. 編輯與刪除 modal
========================================== */
function openEditModal(id) {
    const item = records.find(r => String(r.id) === String(id));
    if (!item) return;

    if (item.status === "approved") {
        alert("⚠️ 該筆紀錄已經老師審核核可，無法再變更！");
        return;
    }

    document.getElementById("edit-record-id").value = item.id;
    document.getElementById("edit-record-title").value = item.title;
    document.getElementById("edit-record-score").value = item.score;
    document.getElementById("edit-modal").classList.remove("hidden");
}

function closeEditModal() {
    document.getElementById("edit-modal").classList.add("hidden");
}

function saveEditedRecord() {
    const id = document.getElementById("edit-record-id").value;
    const newTitle = document.getElementById("edit-record-title").value.trim();
    const newScore = document.getElementById("edit-record-score").value.trim();

    if (!newTitle || !newScore) {
        alert("請輸入完整資料。");
        return;
    }

    const item = records.find(r => String(r.id) === String(id));
    if (item) {
        if (item.status === "approved") {
            alert("⚠️ 該筆紀錄已經老師審核核可，無法修改！");
            closeEditModal();
            return;
        }
        item.title = newTitle;
        item.score = newScore;
        saveData();
        closeEditModal();
        alert("✏️ 修改成功！");
    }
}

function deleteRecord(id) {
    const item = records.find(r => String(r.id) === String(id));
    if (!item) return;

    if (item.status === "approved") {
        alert("⚠️ 該筆紀錄已經老師審核核可，無法刪除！");
        return;
    }

    if (confirm("確定要刪除這筆待審核紀錄嗎？")) {
        records = records.filter(r => String(r.id) !== String(id));
        saveData();
    }
}


/* ==========================================
   9. 審核與權限邏輯
========================================== */
function toggleApprove(id) {
    if (currentRole !== "teacher") { alert("只有老師可以審核成績。"); return; }
    const item = records.find(r => String(r.id) === String(id));
    if (!item) return;
    item.status = item.status === "approved" ? "pending" : "approved";
    saveData();
}

function toggleParentVisible(id) {
    if (currentRole !== "teacher") { alert("只有老師可以設定家長公開狀態。"); return; }
    const item = records.find(r => String(r.id) === String(id));
    if (!item) return;
    if (item.status !== "approved") { alert("請先核可成績，再設定家長公開。"); return; }
    item.visibleToParent = !item.visibleToParent;
    saveData();
}


/* ==========================================
   10. 畫面渲染與矩陣圖繪製
========================================== */
function escapeHTML(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderAll() {
    let filtered = records;

    if (currentRole === "student") {
        filtered = records.filter(r => r.student === currentStudent);
    } else if (currentRole === "parent") {
        filtered = records.filter(r => r.student === currentStudent && r.status === "approved" && r.visibleToParent === true);
    }

    renderOverview(filtered);
    renderCategoryList("daily-list", "平時成績", filtered);
    renderCategoryList("exam-list", "定期評量成績", filtered);
    renderCategoryList("lang-list", "語文檢定", filtered);
    renderCategoryList("reading-list", "閱讀成長", filtered);
    renderCategoryList("support-list", "學習扶助", filtered);
    renderReview();

    /* 渲染語文檢定專屬紅綠燈表格 */
    renderEnglishMatrix();
    renderWeeklyMatrix();
}

function renderOverview(data) {
    const body = document.getElementById("overview-table-body");
    if (!body) return;

    if (data.length === 0) {
        body.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">尚無紀錄</td></tr>`;
        return;
    }

    body.innerHTML = data.map(r => `
        <tr class="border-b">
            <td class="p-3 font-medium">${escapeHTML(r.student)}</td>
            <td class="p-3"><span class="bg-slate-200 text-xs px-2 py-1 rounded">${escapeHTML(r.mainCat)}</span></td>
            <td class="p-3">${escapeHTML(r.subCat)} - ${escapeHTML(r.title)}</td>
            <td class="p-3 text-indigo-600 font-bold">${escapeHTML(r.score)} ${r.finalScore ? `(期末:${escapeHTML(r.finalScore)})` : ''}</td>
            <td class="p-3">${r.status === "approved" ? '<span class="text-emerald-600 font-medium">✓ 已核可</span>' : '<span class="text-amber-600 font-medium">⏳ 待審核</span>'}</td>
            <td class="p-3">${r.visibleToParent ? "👁️ 公開" : "🔒 隱藏"}</td>
            <td class="p-3">${renderActionButtons(r)}</td>
        </tr>
    `).join("");
}

function renderCategoryList(elementId, category, data) {
    const body = document.getElementById(elementId);
    if (!body) return;

    const items = data.filter(r => r.mainCat === category);
    if (items.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">尚無紀錄</td></tr>`;
        return;
    }

    body.innerHTML = items.map(r => `
        <tr class="border-b">
            <td class="p-3 font-medium">${escapeHTML(r.student)}</td>
            <td class="p-3">${escapeHTML(r.subCat)}</td>
            <td class="p-3">${escapeHTML(r.title)}</td>
            <td class="p-3 text-indigo-600 font-bold">${escapeHTML(r.score)} ${r.finalScore ? `(期末:${escapeHTML(r.finalScore)})` : ''}</td>
            <td class="p-3">${r.status === "approved" ? '<span class="text-emerald-600 font-medium">✓ 已核可</span>' : '<span class="text-amber-600 font-medium">⏳ 待審核</span>'}</td>
            <td class="p-3">${renderActionButtons(r)}</td>
        </tr>
    `).join("");
}

function renderActionButtons(r) {
    if (currentRole !== "student") return `<span class="text-xs text-slate-400">-</span>`;

    if (r.status === "pending") {
        return `
            <div class="flex items-center gap-2">
                <button type="button" onclick="openEditModal('${r.id}')" class="text-xs bg-amber-100 text-amber-700 hover:bg-amber-200 px-2 py-1 rounded">✏️ 編輯</button>
                <button type="button" onclick="deleteRecord('${r.id}')" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-2 py-1 rounded">🗑️ 刪除</button>
            </div>
        `;
    } else {
        return `<span class="text-xs text-slate-400 font-semibold">🔒 已鎖定</span>`;
    }
}

function renderReview() {
    const body = document.getElementById("review-table-body");
    if (!body || currentRole !== "teacher") return;

    if (records.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">目前沒有待審核資料</td></tr>`;
        return;
    }

    body.innerHTML = records.map(r => {
        const approved = r.status === "approved";
        return `
            <tr class="border-b">
                <td class="p-3">${escapeHTML(r.student)}</td>
                <td class="p-3 text-xs">${escapeHTML(r.mainCat)}</td>
                <td class="p-3">${escapeHTML(r.subCat)}（${escapeHTML(r.title)}）</td>
                <td class="p-3 text-indigo-600 font-bold">${escapeHTML(r.score)}</td>
                <td class="p-3">
                    <button type="button" onclick="toggleApprove('${r.id}')" class="px-3 py-1.5 rounded text-xs text-white ${approved ? "bg-emerald-600 hover:bg-emerald-700" : "bg-slate-500 hover:bg-slate-600"}">
                        ${approved ? "✓ 已核可" : "點擊核可"}
                    </button>
                </td>
                <td class="p-3">
                    <label class="cursor-pointer text-xs flex items-center gap-2">
                        <input type="checkbox" onchange="toggleParentVisible('${r.id}')" ${r.visibleToParent ? "checked" : ""} ${!approved ? "disabled" : ""} class="w-4 h-4">
                        公開給家長
                    </label>
                </td>
            </tr>
        `;
    }).join("");
}


/* ==========================================
   11. 英檢單字闖關號誌燈矩陣 (學生/家長/老師)
========================================== */
function renderEnglishMatrix() {
    const container = document.getElementById("lang-matrix-wrapper");
    const titleEl = document.getElementById("lang-matrix-title");
    if (!container) return;

    const engRecords = records.filter(r => r.subCat === "英檢單字檢定" && (currentRole === "teacher" || r.status === "approved"));

    if (currentRole === "teacher") {
        if (titleEl) titleEl.textContent = "全班學生 - 英檢單字闖關全覽總表（依座號）";

        let html = `
            <table class="w-full text-xs text-center border-collapse border border-slate-200">
                <thead>
                    <tr class="bg-indigo-50 text-indigo-900 border-b">
                        <th class="p-2 border border-slate-200 min-w-[100px]">座號/姓名</th>
                        <th class="p-2 border border-slate-200">第一級<br>(2~6關)</th>
                        <th class="p-2 border border-slate-200">第二級<br>(1~6關)</th>
                        <th class="p-2 border border-slate-200">第三級<br>(1~6關)</th>
                        <th class="p-2 border border-slate-200">第四級<br>(1~6關)</th>
                    </tr>
                </thead>
                <tbody>
        `;

        STUDENT_LIST.forEach(student => {
            html += `<tr class="border-b hover:bg-slate-50"><td class="p-2 font-bold text-left border border-slate-200">${student}</td>`;

            ENGLISH_LEVELS.forEach(lvl => {
                html += `<td class="p-1 border border-slate-200"><div class="flex flex-wrap gap-1 justify-center">`;
                lvl.pass.forEach(g => {
                    const titleKey = `${lvl.level} 第${g}關`;
                    const match = engRecords.find(r => r.student === student && r.title === titleKey);
                    let symbol = '<span title="未測驗" class="opacity-30">⚪</span>';
                    if (match) {
                        symbol = match.score.includes("通過") && !match.score.includes("未") ? '<span title="通過">🟢</span>' : '<span title="未通過">🔴</span>';
                    }
                    html += `<span class="inline-block" title="${titleKey}">${symbol}</span>`;
                });
                html += `</div></td>`;
            });
            html += `</tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

    } else {
        if (titleEl) titleEl.textContent = `${currentStudent} - 英檢單字闖關通過情形表`;

        let html = `
            <table class="w-full text-sm text-center border-collapse border border-slate-200">
                <thead>
                    <tr class="bg-slate-100 text-slate-700">
                        <th class="p-3 border">級數</th>
                        <th class="p-3 border">第1關</th>
                        <th class="p-3 border">第2關</th>
                        <th class="p-3 border">第3關</th>
                        <th class="p-3 border">第4關</th>
                        <th class="p-3 border">第5關</th>
                        <th class="p-3 border">第6關</th>
                    </tr>
                </thead>
                <tbody>
        `;

        ENGLISH_LEVELS.forEach(lvl => {
            html += `<tr><td class="p-3 font-bold bg-indigo-50/50 border">${lvl.level}</td>`;
            for (let g = 1; g <= 6; g++) {
                if (!lvl.pass.includes(g)) {
                    html += `<td class="p-3 bg-slate-100/50 text-slate-300 border text-xs">無此關</td>`;
                } else {
                    const titleKey = `${lvl.level} 第${g}關`;
                    const match = engRecords.find(r => r.student === currentStudent && r.title === titleKey);
                    let symbol = "⚪ 未測驗";
                    if (match) {
                        symbol = match.score.includes("通過") && !match.score.includes("未") ? "🟢 通過" : "🔴 未通過";
                    }
                    html += `<td class="p-3 border font-medium">${symbol}</td>`;
                }
            }
            html += `</tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }
}


/* ==========================================
   12. 每週一句與期末闖關分數統計表
========================================== */
function renderWeeklyMatrix() {
    const container = document.getElementById("weekly-matrix-wrapper");
    if (!container) return;

    const weeklyRecords = records.filter(r => r.subCat === "每週一句" && (currentRole === "teacher" || r.status === "approved"));

    if (currentRole === "teacher") {
        let html = `
            <table class="w-full text-xs text-center border-collapse border border-slate-200">
                <thead>
                    <tr class="bg-emerald-50 text-emerald-900 border-b">
                        <th class="p-2 border min-w-[100px]">座號/姓名</th>
                        <th class="p-2 border">1~16 句通過情況</th>
                        <th class="p-2 border min-w-[90px]">期末闖關分數</th>
                    </tr>
                </thead>
                <tbody>
        `;

        STUDENT_LIST.forEach(student => {
            const studentRecs = weeklyRecords.filter(r => r.student === student);
            let latestFinal = "未闖關";

            html += `<tr class="border-b hover:bg-slate-50"><td class="p-2 font-bold text-left border">${student}</td>`;
            html += `<td class="p-2 border"><div class="flex flex-wrap gap-1 justify-center">`;

            for (let i = 1; i <= 16; i++) {
                const sentenceKey = `第${numberToChinese(i)}句`;
                const match = studentRecs.find(r => r.title === sentenceKey);
                let symbol = '<span class="opacity-20">⚪</span>';
                if (match) {
                    symbol = match.score.includes("通過") && !match.score.includes("未") ? "🟢" : "🔴";
                    if (match.finalScore) latestFinal = match.finalScore;
                }
                html += `<span title="${sentenceKey}">${symbol}</span>`;
            }

            let badgeClass = "bg-slate-100 text-slate-500";
            if (latestFinal === "特優") badgeClass = "bg-amber-100 text-amber-800 font-bold";
            if (latestFinal === "優") badgeClass = "bg-emerald-100 text-emerald-800 font-bold";
            if (latestFinal === "未通過") badgeClass = "bg-red-100 text-red-700";

            html += `</div></td>`;
            html += `<td class="p-2 border"><span class="px-2 py-1 rounded text-xs ${badgeClass}">${latestFinal}</span></td></tr>`;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;

    } else {
        const myRecs = weeklyRecords.filter(r => r.student === currentStudent);
        let latestFinal = "未闖關";

        let html = `
            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 text-center mb-4">
        `;

        for (let i = 1; i <= 16; i++) {
            const sentenceKey = `第${numberToChinese(i)}句`;
            const match = myRecs.find(r => r.title === sentenceKey);
            let statusText = "⚪ 未測驗";
            if (match) {
                statusText = match.score.includes("通過") && !match.score.includes("未") ? "🟢 通過" : "🔴 未通過";
                if (match.finalScore) latestFinal = match.finalScore;
            }
            html += `
                <div class="p-2 bg-slate-50 border rounded-lg">
                    <div class="text-xs text-slate-500">第${i}句</div>
                    <div class="text-xs font-bold mt-1">${statusText}</div>
                </div>
            `;
        }

        let badgeClass = "bg-slate-100 text-slate-600";
        if (latestFinal === "特優") badgeClass = "bg-amber-100 text-amber-800 font-bold text-base";
        if (latestFinal === "優") badgeClass = "bg-emerald-100 text-emerald-800 font-bold text-base";
        if (latestFinal === "未通過") badgeClass = "bg-red-100 text-red-700";

        html += `</div>
            <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg flex justify-between items-center">
                <span class="text-sm font-bold text-amber-900">🎓 期末闖關總評估結果：</span>
                <span class="px-3 py-1 rounded-full ${badgeClass}">${latestFinal}</span>
            </div>
        `;

        container.innerHTML = html;
    }
}


/* ==========================================
   13. 重設測試資料
========================================== */
function resetTestData() {
    if (confirm("確定要刪除所有測試資料嗎？\n此動作無法復原。")) {
        try {
            localStorage.removeItem("gradeRecords_v34");
            records = [];
            renderAll();
            alert("測試資料已清除。");
        } catch (error) {
            alert("清除資料時發生錯誤。");
        }
    }
}


/* ==========================================
   14. 表單與事件綁定
========================================== */
document.addEventListener("DOMContentLoaded", function () {
    const forms = [
        { id: "daily-form", cat: "平時成績" },
        { id: "exam-form", cat: "定期評量成績" },
        { id: "language-form", cat: "語文檢定" },
        { id: "reading-form", cat: "閱讀成長" },
        { id: "support-form", cat: "學習扶助" }
    ];

    forms.forEach(f => {
        const el = document.getElementById(f.id);
        if (el) {
            el.addEventListener("submit", function (e) {
                e.preventDefault();
                addRecord(f.cat);
            });
        }
    });

    const dailySubcat = document.getElementById("daily-subcat");
    if (dailySubcat) dailySubcat.addEventListener("change", updateDailyForm);

    const hwType = document.getElementById("hw-type");
    if (hwType) hwType.addEventListener("change", updateDailyForm);
});
</script>
