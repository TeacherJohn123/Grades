<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>學生成績與學習歷程平台 v7.2 (含雙期程平時成績結算與記憶)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { -webkit-text-size-adjust: 100%; }
        button, select, input, textarea { touch-action: manipulation; }
        .active-tab { background-color: #3B82F6 !important; color: white !important; }
        .dynamic-hidden, .content-sec.hidden { display: none !important; }
        select, input { min-height: 44px; }
        button { min-height: 42px; }
        @media (max-width: 768px) {
            table { min-width: 750px; }
            .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

<header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-graduation-cap text-2xl text-yellow-300"></i>
            <h1 class="text-lg md:text-xl font-bold tracking-wide">
                學生成績與學習歷程平台
                <span class="text-xs md:text-sm text-yellow-200 bg-indigo-800 px-2 py-0.5 rounded ml-1">v7.2</span>
            </h1>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium hidden sm:inline">👤 選擇學生：</span>
                <select id="current-student-select" onchange="switchStudent(this.value)" class="bg-indigo-800 text-white text-xs md:text-sm rounded border-none p-1 focus:ring-2 focus:ring-yellow-300">
                </select>
            </div>

            <div class="flex items-center bg-indigo-900/60 p-1 rounded-lg border border-indigo-400/30 text-sm">
                <span class="px-2 text-indigo-200 font-medium hidden sm:inline">當前身份：</span>
                <button type="button" onclick="switchRole('student')" id="role-btn-student" class="role-btn px-3 py-1 rounded-md font-medium text-white bg-indigo-600 shadow">👨‍🎓 學生</button>
                <button type="button" onclick="switchRole('teacher')" id="role-btn-teacher" class="role-btn px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white">👩‍🏫 老師</button>
                <button type="button" onclick="switchRole('parent')" id="role-btn-parent" class="role-btn px-3 py-1 rounded-md font-medium text-indigo-200 hover:text-white">👪 家長</button>
            </div>
        </div>
    </div>
</header>

<div class="max-w-7xl mx-auto w-full px-4 py-6 flex-1 flex flex-col md:flex-row gap-6">

    <aside class="w-full md:w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 h-fit">
        <nav class="space-y-1">
            <button type="button" onclick="switchTab('overview')" id="tab-overview" class="tab-btn w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-slate-600 hover:bg-slate-100 font-medium active-tab">
                <i class="fa-solid fa-chart-pie w-5"></i><span>數據總覽與統計</span>
            </button>
            <button type="button" onclick="switchTab('daily')" id="tab-
